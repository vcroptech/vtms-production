async function submitTeacher() { return withBusyGuard(() => submitTeacher_impl()); }
async function submitTeacher_impl() {
  const name = document.getElementById('t-name').value.trim();
  const phone = document.getElementById('t-phone').value.trim();
  const orgId = document.getElementById('t-org').value || null;
  const subs = document.getElementById('t-subs').value.split(',').map(s => s.trim()).filter(Boolean);
  const grades = document.getElementById('t-grades').value.split(',').map(s => s.trim()).filter(Boolean);
  const exp = document.getElementById('t-exp').value.trim();
  const email = document.getElementById('t-email').value.trim().toLowerCase();
  const pass = document.getElementById('t-pass').value;
  if (!name) { showToast('Please enter the teacher\'s full name.', 'danger'); return; }
  if (!orgId) { showToast('Please select an Organization.', 'danger'); return; }
  if (!subs.length) { showToast('Please enter at least one subject.', 'danger'); return; }
  if (!email) { showToast('Please enter the email address.', 'danger'); return; }
  // Basic email format check
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email address.', 'danger'); return; }
  if (!pass) { showToast('Please enter a password.', 'danger'); return; }
  if (pass.length < 6) { showToast('Password must be at least 6 characters.', 'danger'); return; }
  // Email uniqueness check (case-insensitive)
  const existing = APP.data.users.find(u => u.email.toLowerCase() === email);
  if (existing) { showToast(`Email "${email}" is already registered to ${existing.name}. Each user must have a unique email.`, 'danger'); return; }
  // Create the real login (Firebase Auth) first, on a secondary app instance so
  // this doesn't disturb the admin's own signed-in session. Everything else only
  // proceeds once this succeeds, so we never end up with a VTMS profile that has
  // no way to actually log in.
  let authUid;
  try {
    authUid = await createAuthAccountWithoutSwitchingSession(email, pass);
  } catch(e) {
    showToast('Could not create the login for this teacher: ' + (e.message || e.code || 'unknown error'), 'danger');
    return;
  }
  const userId = uid();
  const user = { id: userId, name, email, mobile: phone || null, role: 'teacher', orgId, schoolId: null, mustChangePassword: true };
  const resumeLink = (document.getElementById('t-resume') || {}).value?.trim() || '';
  const teacher = { id: uid(), userId, name, subjects: subs, grades, experience: exp, phone, resumeLink: resumeLink || null, allocations: [] };
  await DB.set('users', user.id, user);
  await linkAuthAccount(authUid, user.id);
  await DB.set('teachers', teacher.id, teacher);
  APP.data.users.push(user); APP.data.teachers.push(teacher);
  closeModal(); showToast('Teacher added!', 'success'); render();
}


function onAllocReqChange() {
  const reqSel = document.getElementById('al-req');
  const schoolSel = document.getElementById('al-school');
  const teacherSel = document.getElementById('al-teacher');
  const cpdSel = document.getElementById('al-cpd');
  const cpdHint = document.getElementById('al-cpd-hint');

  if (!reqSel || !reqSel.value) {
    // No requirement selected — enable manual classesPerDay entry, and reset School/
    // Teacher back to blank too (previously only Classes/day was reset here, leaving
    // whatever the last-selected requirement had auto-filled still sitting there).
    if (schoolSel) schoolSel.selectedIndex = 0;
    if (teacherSel) teacherSel.selectedIndex = 0;
    if (cpdSel) { cpdSel.disabled = false; cpdSel.value = ''; }
    if (cpdHint) cpdHint.textContent = ' (enter manually, or select a requirement above to auto-fill)';
    return;
  }

  const opt = reqSel.options[reqSel.selectedIndex];
  const schoolId = opt.getAttribute('data-school');
  const candidateName = opt.getAttribute('data-candidate');
  const cpd = opt.getAttribute('data-cpd');

  // Auto-select school
  if (schoolId && schoolSel) {
    for (let i = 0; i < schoolSel.options.length; i++) {
      if (schoolSel.options[i].value === schoolId) { schoolSel.selectedIndex = i; break; }
    }
  }
  // Auto-select teacher by candidate name
  if (candidateName && teacherSel) {
    for (let i = 0; i < teacherSel.options.length; i++) {
      if (teacherSel.options[i].text.toLowerCase().includes(candidateName.toLowerCase())) {
        teacherSel.selectedIndex = i; break;
      }
    }
  }
  // Auto-fill classesPerDay from requirement (disabled)
  if (cpdSel) {
    cpdSel.value = cpd || '';
    cpdSel.disabled = true;
  }
  if (cpdHint) cpdHint.textContent = ' (auto-filled from requirement — ' + (cpd||'?') + ' classes/day)';
}

// Detects an exact class+section+subject duplicate within a set of assigned-class rows
// (e.g. two rows both saying "3-A, English"). Returns a description of the first
// duplicate found, or null if none. Used by both the Allocate modal and Edit Allocated
// Classes modal to block submission before it silently saves a redundant duplicate row.
function findDuplicateClassRow(rows) {
  const seen = new Set();
  for (const r of rows) {
    const key = `${r.cls}|${r.section}|${r.subject || ''}`;
    if (seen.has(key)) return `${r.cls}-${r.section}${r.subject ? ' (' + r.subject + ')' : ''}`;
    seen.add(key);
  }
  return null;
}

async function submitAllocate() { return withBusyGuard(() => submitAllocate_impl()); }
async function submitAllocate_impl() {
  const tid = document.getElementById('al-teacher').value;
  const sid = document.getElementById('al-school').value;
  const cpd = parseInt(document.getElementById('al-cpd')?.value) || 0;
  if (!tid) { showToast('Please select a teacher.', 'danger'); return; }
  if (!sid) { showToast('Please select a school.', 'danger'); return; }
  if (!cpd) { showToast('Please select classes per day.', 'danger'); return; }
  // Collect class-section pairs
  const clsSections = [];
  document.querySelectorAll('[id^="al-cls-row-"]').forEach(row => {
    const idx = row.id.replace('al-cls-row-', '');
    const cls = document.getElementById('al-cls-' + idx)?.value;
    const sec = document.getElementById('al-sec-' + idx)?.value;
    const subj = document.getElementById('al-subj-' + idx)?.value;
    if (cls && sec) clsSections.push({ cls, section: sec, subject: subj || '' });
  });
  const dupRow = findDuplicateClassRow(clsSections);
  if (dupRow) { showToast(`Class ${dupRow} is entered more than once — please remove the duplicate row.`, 'danger'); return; }
  const reqId = document.getElementById('al-req') ? document.getElementById('al-req').value : '';
  const t = APP.data.teachers.find(t => t.id === tid);
  if (!t.allocations) t.allocations = [];
  if (t.allocations.some(a => a.schoolId === sid && a.active)) { showToast('Already allocated to this school.', 'danger'); return; }
  // If more specific classes were listed than the picked "classes per day" number,
  // treat the concrete list as the truer figure and bump classesPerDay to match —
  // otherwise the allocation starts out already understating this teacher's real load.
  const finalCpd = Math.max(cpd, clsSections.length);
  if (finalCpd !== cpd) showToast(`Classes per day adjusted to ${finalCpd} to match the ${clsSections.length} classes listed.`, 'success');
  t.allocations.push({ schoolId: sid, active: true, lastDate: null, allocatedAt: today(), classesPerDay: finalCpd, assignedClasses: clsSections });
  const u = APP.data.users.find(u => u.id === t.userId);
  if (u) {
    const school = APP.data.schools.find(s => s.id === sid);
    const newOrgId = school ? school.orgId : u.orgId;
    u.schoolId = sid; u.orgId = newOrgId;
    await DB.update('users', u.id, { schoolId: sid, orgId: newOrgId });
  }
  await DB.update('teachers', tid, { allocations: t.allocations });
  // If a requirement was selected, mark it as completed
  let completedReqMsg = '';
  if (reqId) {
    const rq = APP.data.requirements.find(r => r.id === reqId);
    if (rq) {
      const completedUpdates = {
        status: 'completed',
        allocatedTeacherId: tid,
        allocatedTeacherName: t.name,
        completedAt: new Date().toISOString(),
        completedBy: APP.user.id,
        completedByName: APP.user.name
      };
      Object.assign(rq, completedUpdates);
      await DB.update('requirements', reqId, completedUpdates);
      completedReqMsg = ' Requirement marked as completed.';
    }
  }
  // Notify Org Admin and Head Teacher (HT via direct), and the CC assigned to this school
  const allocSchool = APP.data.schools.find(s => s.id === sid);
  const notifMsg = APP.user.name + ' allocated ' + t.name + ' to ' + (allocSchool ? allocSchool.name : 'school') + (reqId ? ' — requirement completed!' : '');
  const assignedCC = allocSchool ? getCCForSchool(allocSchool.id) : null;
  await createNotificationDirect(
    'requirement',
    'Teacher allocated to school',
    notifMsg,
    reqId || tid,
    APP.user.id,
    reqId ? (APP.data.requirements.find(r => r.id === reqId) || {}).createdBy : null,
    ['org_admin']
  );
  if (assignedCC) {
    await DB.set('notifications', uid(), { type:'requirement', title:'Teacher allocated to school', message: notifMsg, forUserId: assignedCC.id, relatedId: reqId || tid, createdAt: new Date().toISOString(), read: false });
  }
  // Notify the school's Head Teacher directly — this fires regardless of whether the
  // allocation is linked to a requirement they raised (the requirement-creator path
  // above only reaches the HT if THEY happened to raise it), and includes the
  // teacher's own contact details so the HT has someone to reach immediately.
  const allocHTForNotif = allocSchool ? getHTForSchool(allocSchool.id) : null;
  if (allocHTForNotif) {
    const teacherUser = t.userId ? APP.data.users.find(u => u.id === t.userId) : null;
    const teacherContactLine = ` Teacher: ${t.name}${t.phone ? ', ' + t.phone : ''}${teacherUser && teacherUser.email ? ', ' + teacherUser.email : ''}.`;
    const htNotifMsg = APP.user.name + ' allocated ' + t.name + ' to your school' + (reqId ? ' — requirement completed!' : '') + teacherContactLine;
    await DB.set('notifications', uid(), { type:'allocation', title:'New teacher allocated to your school', message: htNotifMsg, forUserId: allocHTForNotif.id, relatedId: reqId || tid, createdAt: new Date().toISOString(), read: false });
  }
  // Notify the teacher themselves — include the Head Teacher's contact details so the
  // teacher has someone to reach out to immediately, without needing to ask around.
  if (t.userId) {
    const allocHT = allocSchool ? getHTForSchool(allocSchool.id) : null;
    const htContactLine = allocHT ? ` Head Teacher: ${allocHT.name}${allocHT.mobile ? ', ' + allocHT.mobile : ''}${allocHT.email ? ', ' + allocHT.email : ''}.` : '';
    const teacherMsg = 'You have been allocated to ' + (allocSchool ? allocSchool.name : 'a school') + ' by ' + APP.user.name + (reqId ? ' — requirement completed!' : '') + htContactLine;
    await DB.set('notifications', uid(), { type:'allocation', title:'You have been allocated to a school', message: teacherMsg, forUserId: t.userId, relatedId: reqId || tid, createdAt: new Date().toISOString(), read: false });
  }
  closeModal();
  showToast('Teacher allocated!' + completedReqMsg, 'success');
  syncData(true);
}

async function submitUser() { return withBusyGuard(() => submitUser_impl()); }
async function submitUser_impl() {
  const name = document.getElementById('u-name').value.trim();
  const email = document.getElementById('u-email').value.trim().toLowerCase();
  const mobile = document.getElementById('u-mobile').value.trim();
  const r = document.getElementById('u-role').value;
  const pass = document.getElementById('u-pass').value;
  const orgId = document.getElementById('u-org').value || null;
  const isMulti = r === 'cluster_coordinator' || r === 'head_teacher';
  let schoolIds = [], schoolId = null;
  if (isMulti) {
    const cbs = document.querySelectorAll('.u-sch-cb:checked');
    schoolIds = Array.from(cbs).map(cb => cb.value);
    schoolId = schoolIds[0] || null;
  } else {
    schoolId = document.getElementById('u-school')?.value || null;
  }
  // Per-field validation
  if (!name) { showToast('Please enter the full name.', 'danger'); return; }
  if (!email) { showToast('Please enter the email address.', 'danger'); return; }
  if (!r) { showToast('Please select a role.', 'danger'); return; }
  // Basic email format check
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email address.', 'danger'); return; }
  if (!pass) { showToast('Please enter a password.', 'danger'); return; }
  if (pass.length < 6) { showToast('Password must be at least 6 characters.', 'danger'); return; }
  // Role-specific validation
  if (r === 'org_admin' && !orgId) { showToast('Please select an Organization for the Org Admin.', 'danger'); return; }
  if (r === 'cluster_coordinator' && !orgId) { showToast('Please select an Organization for Cluster Coordinator.', 'danger'); return; }
  if (r === 'cluster_coordinator' && schoolIds.length === 0) { showToast('Please select at least one school for Cluster Coordinator.', 'danger'); return; }
  if (r === 'head_teacher' && !orgId) { showToast('Please select an Organization for the Head Teacher.', 'danger'); return; }
  if (r === 'head_teacher' && schoolIds.length === 0 && !schoolId) { showToast('Please select a School for the Head Teacher.', 'danger'); return; }
  // Email uniqueness check (case-insensitive)
  const existing = APP.data.users.find(u => u.email.toLowerCase() === email);
  if (existing) { showToast(`Email "${email}" is already registered to ${existing.name}. Each user must have a unique email.`, 'danger'); return; }
  // Create the real login (Firebase Auth) first, on a secondary app instance so
  // this doesn't disturb the admin's own signed-in session. Everything else only
  // proceeds once this succeeds, so we never end up with a VTMS profile that has
  // no way to actually log in.
  let authUid;
  try {
    authUid = await createAuthAccountWithoutSwitchingSession(email, pass);
  } catch(e) {
    showToast('Could not create the login for this user: ' + (e.message || e.code || 'unknown error'), 'danger');
    return;
  }
  const u = { id: uid(), name, email, mobile: mobile || null, role: r, orgId, schoolId: schoolId || null, schoolIds: isMulti ? schoolIds : (schoolId ? [schoolId] : []), mustChangePassword: true };
  await DB.set('users', u.id, u);
  await linkAuthAccount(authUid, u.id);
  APP.data.users.push(u);
  // Auto-sync: if Org Admin, update org's adminId automatically
  if (r === 'org_admin' && orgId) {
    const org = APP.data.orgs.find(o => o.id === orgId);
    if (org) { org.adminId = u.id; await DB.update('orgs', orgId, { adminId: u.id }); }
  }
  // Auto-sync: if Head Teacher, update school's headTeacherId automatically
  if (r === 'head_teacher' && schoolId) {
    const school = APP.data.schools.find(s => s.id === schoolId);
    if (school) { school.headTeacherId = u.id; await DB.update('schools', schoolId, { headTeacherId: u.id }); }
  }
  closeModal(); showToast('User added!', 'success'); render();
}

async function submitEditAllocClasses(tid) {
  const t = APP.data.teachers.find(t => t.id === tid);
  if (!t) return;
  const activeAllocs = (t.allocations || []).filter(a => a.active);
  // First pass: build the new class list for every allocation and validate for
  // duplicates before committing anything, so a duplicate in one school's rows
  // doesn't leave other schools half-saved.
  const newClsByAlloc = [];
  for (let ai = 0; ai < activeAllocs.length; ai++) {
    const container = document.getElementById('edit-cls-rows-' + ai);
    const newCls = [];
    if (container) {
      const rows = container.querySelectorAll(':scope > div');
      rows.forEach(row => {
        const selects = row.querySelectorAll('select');
        if (selects.length >= 2) {
          const cls = selects[0].value;
          const sec = selects[1].value;
          const subj = selects.length >= 3 ? selects[2].value : '';
          if (cls && sec) newCls.push({ cls, section: sec, subject: subj || '' });
        }
      });
    }
    const dupRow = findDuplicateClassRow(newCls);
    if (dupRow) {
      const school = APP.data.schools.find(s => s.id === activeAllocs[ai].schoolId);
      showToast(`Class ${dupRow} is entered more than once for ${school ? school.name : 'this school'} — please remove the duplicate row.`, 'danger');
      return;
    }
    newClsByAlloc.push(newCls);
  }
  let anyCpdBumped = false;
  activeAllocs.forEach((a, ai) => {
    a.assignedClasses = newClsByAlloc[ai];
    // Keep classesPerDay from silently understating the actual class list — this modal
    // has no separate field to edit it, so this is the only place it can get corrected.
    const bumped = Math.max(a.classesPerDay || 0, newClsByAlloc[ai].length);
    if (bumped !== (a.classesPerDay || 0)) anyCpdBumped = true;
    a.classesPerDay = bumped;
  });
  await DB.update('teachers', tid, { allocations: t.allocations });
  editAllocRowCounts = {};
  closeModal();
  showToast(anyCpdBumped ? 'Classes updated — classes/day was also adjusted to match the classes listed.' : 'Classes updated successfully.', 'success');
  render();
}

async function confirmResetPassword(userId) { return withBusyGuard(() => confirmResetPassword_impl(userId)); }
async function confirmResetPassword_impl(userId) {
  const newPass = document.getElementById('reset-pass').value;
  const confirm = document.getElementById('reset-pass-confirm').value;
  if (!newPass) { showToast('Enter a new password.', 'danger'); return; }
  if (newPass.length < 6) { showToast('Password must be at least 6 characters.', 'danger'); return; }
  if (newPass !== confirm) { showToast('Passwords do not match.', 'danger'); return; }
  const u = APP.data.users.find(u => u.id === userId);
  if (!u) return;
  // The actual password change happens server-side (Cloud Function), since
  // Firebase Auth doesn't allow one signed-in client to overwrite someone
  // else's password directly — only the account owner, or trusted server code.
  try {
    // Force a fresh ID token before this call. Cached tokens are normally
    // fine, but this call is security-sensitive and infrequent enough that
    // it's worth paying the extra round trip to rule out any stale-token
    // timing issue as a cause of failure.
    if (auth.currentUser) { try { await auth.currentUser.getIdToken(true); } catch(e) {} }
    console.log('[VTMS DEBUG] About to call adminResetPassword.', {
      shownAsAppUser: APP.user && APP.user.email,
      authCurrentUserEmail: auth.currentUser && auth.currentUser.email,
      authCurrentUserUid: auth.currentUser && auth.currentUser.uid,
    });
    const resetFn = httpsCallable(functionsInstance, 'adminResetPassword');
    await resetFn({ targetUserId: userId, newPassword: newPass });
  } catch(e) {
    showToast('Could not reset password: ' + (e.message || e.code || 'unknown error'), 'danger');
    return;
  }
  u.mustChangePassword = true;
  delete u.passwordHash; delete u.passwordSalt; delete u.password;
  // If admin reset their OWN password (unlikely but safe), update APP.user too
  if (APP.user && APP.user.id === userId) { APP.user.mustChangePassword = true; delete APP.user.passwordHash; delete APP.user.passwordSalt; delete APP.user.password; }
  // Auto-resolve any pending reset requests for this user
  const pendingReqs = (APP.data.resetRequests||[]).filter(r=>r.userId===userId && r.status==='pending');
  for(const req of pendingReqs){
    req.status='resolved';
    req.resolvedAt=new Date().toISOString();
    await DB.update('password_reset_requests', req.id, {status:'resolved', resolvedAt:req.resolvedAt});
  }
  closeModal();
  showToast(`Password reset for ${u.name}. Share the new password with them.`, 'success');
  render();
}

async function submitEditAtt(id) {
  const a = APP.data.attendance.find(a => a.id === id);
  if (!a) return;
  if (a.headApproval && a.headApproval !== 'rejected' && a.orgApproval !== 'rejected' && role() !== 'vcrop_admin') { showToast('Cannot edit — already approved by Head Teacher.', 'danger'); return; }
  const dayStatus = document.getElementById('ea-daystat').value;
  const classStatus = document.getElementById('ea-clsstatus').value;
  const duration  = parseInt(document.getElementById('ea-dur').value);
  const assigned  = parseInt(document.getElementById('ea-assigned').value);
  const conducted = parseInt(document.getElementById('ea-conducted').value);
  const topics    = document.getElementById('ea-topics').value.trim();
  const hw        = document.getElementById('ea-hw').value.trim();
  const hwLink    = document.getElementById('ea-hwlink').value.trim();
  if (!topics) { showToast('Topics taught cannot be empty.', 'danger'); return; }
  if (!classStatus) { showToast('Please select the class status.', 'danger'); return; }
  const wasRejected = a.headApproval === 'rejected' || a.orgApproval === 'rejected';
  const editedAt = new Date().toISOString();
  // Record this edit in the append-only history log BEFORE we clear the current
  // headApproval/rejectionReason fields below — otherwise the fact that this record
  // was ever rejected (and why) is lost the moment it's resubmitted, and the Action
  // trail modal ends up only showing the eventual Approved entry with no trace of the
  // rejection that preceded it.
  const editorRole = role() === 'vcrop_admin' ? 'vCrop Admin' : 'Teacher';
  const histEntry = { action: wasRejected ? 'resubmitted' : 'edited', role: editorRole, by: APP.user.name, at: editedAt };
  const newHistory = (a.history || []).concat([histEntry]);
  const updates = { dayStatus, classStatus, duration, totalAssigned: assigned, totalConducted: conducted, topics, homework: hw, homeworkLink: hwLink, editedAt, history: newHistory,
    // Use deleteField() to properly clear rejection state in Firestore so the record
    // re-enters the FULL HT -> Org approval chain from scratch — clearing only
    // headApproval left orgApproval:'rejected' behind whenever Org Admin (rather than
    // HT) was the one who rejected it, so the record kept showing "Rejected by Org"
    // in HT's queue even after a fresh resubmission.
    headApproval: deleteField(), headApprovedAt: deleteField(), headApprovedByName: deleteField(),
    orgApproval: deleteField(), orgApprovedAt: deleteField(), orgApprovedByName: deleteField(),
    rejectionReason: deleteField() };
  // Also clear local cache
  Object.assign(a, { dayStatus, duration, totalAssigned: assigned, totalConducted: conducted, topics, homework: hw, homeworkLink: hwLink, editedAt, history: newHistory, headApproval: null, headApprovedAt: null, headApprovedByName: null, orgApproval: null, orgApprovedAt: null, orgApprovedByName: null, rejectionReason: null });
  await DB.update('attendance', id, updates);

  // If this was a rejected record, notify HT, Org Admin and vCrop Admin
  if (wasRejected) {
    const editSchool = APP.data.schools.find(s => s.id === a.schoolId);
    const editMsg = APP.user.name + ' has updated the rejected attendance for ' + fmtDate(a.date) + ', Class ' + a.cls + '-' + a.section + (editSchool ? ' at ' + editSchool.name : '') + '. Please review again.';
    const htUser2 = APP.data.users.find(u => u.role === 'head_teacher' && !u.disabled &&
      ((u.schoolIds && u.schoolIds.includes(a.schoolId)) || u.schoolId === a.schoolId));
    if (htUser2) {
      await DB.set('notifications', uid(), { type:'attendance', title:'Teacher updated rejected attendance', message: editMsg, forUserId: htUser2.id, relatedId: id, createdAt: new Date().toISOString(), read: false });
    }
    await createNotification('attendance', 'Teacher updated rejected attendance', editMsg, ['org_admin', 'vcrop_admin'], id, APP.user.id);
  }

  closeModal();
  showToast('Attendance updated successfully.', 'success');
  syncData(true);
}

// Builds a single chronologically-ordered event list for the attendance Action trail,
// merging the append-only a.history log (new records) with a best-effort synthesis from
// the old single-value fields for legacy records saved before history tracking existed.
// Sorting by timestamp (rather than grouping by role) means a Reject -> Resubmit ->
// Approve sequence always reads top-to-bottom in the order it actually happened,
// regardless of which role performed which step.
function buildAttActionTrail(a) {
  let events;
  if (a.history && a.history.length) {
    events = a.history.slice();
    if (!events.some(e => e.action === 'submitted') && a.markedAt) {
      events.push({ action: 'submitted', role: 'Teacher', at: a.markedAt });
    }
  } else {
    events = [];
    if (a.markedAt) events.push({ action: 'submitted', role: 'Teacher', at: a.markedAt });
    if (a.editedAt) events.push({ action: 'resubmitted', role: 'Teacher', at: a.editedAt });
    if (a.headApproval) events.push({ action: a.headApproval, role: 'Head Teacher', by: a.headApprovedByName, at: a.headApprovedAt, reason: a.headApproval === 'rejected' ? a.rejectionReason : null });
    if (a.orgApproval) events.push({ action: a.orgApproval, role: 'Org Admin (legacy)', by: a.orgApprovedByName, at: a.orgApprovedAt, reason: a.orgApproval === 'rejected' ? a.rejectionReason : null });
  }
  return events.filter(e => e.at).sort((x, y) => new Date(x.at) - new Date(y.at));
}

function attActionTrailLabel(e) {
  if (e.action === 'submitted') return 'Submitted by ' + (e.role || 'Teacher');
  if (e.action === 'resubmitted') return 'Re-submitted after edit — ' + (e.role || 'Teacher');
  if (e.action === 'edited') return 'Edited — ' + (e.role || 'Teacher');
  if (e.action === 'approved') return (e.role || 'Head Teacher') + ' — Approved';
  if (e.action === 'rejected') return (e.role || 'Head Teacher') + ' — Rejected';
  return e.action;
}

async function addSchoolToUser(userId) {
  const sid = document.getElementById('ms-school')?.value;
  if (!sid) { showToast('Select a school to add.', 'danger'); return; }
  const u = APP.data.users.find(x => x.id === userId);
  if (!u) return;
  const ids = [...new Set([...(u.schoolIds || (u.schoolId ? [u.schoolId] : [])), sid])];
  u.schoolIds = ids; u.schoolId = ids[0] || null;
  await DB.update('users', userId, { schoolIds: ids, schoolId: ids[0] || null });
  // Keep the school's headTeacherId reverse-pointer in sync too — reads now go
  // through getHTForSchool (which doesn't need this field), but keeping it accurate
  // avoids a stale/misleading value sitting in Firestore. Mirrors the same auto-sync
  // submitUser_impl already does at user-creation time.
  if (u.role === 'head_teacher') {
    const school = APP.data.schools.find(s => s.id === sid);
    if (school) { school.headTeacherId = u.id; await DB.update('schools', sid, { headTeacherId: u.id }); }
  }
  showToast('School added!', 'success'); openModal('manage_schools', userId); syncData(false);
}

async function removeSchoolFromUser(userId, schoolId) {
  const u = APP.data.users.find(x => x.id === userId);
  if (!u) return;
  const ids = (u.schoolIds || []).filter(id => id !== schoolId);
  u.schoolIds = ids; u.schoolId = ids[0] || null;
  await DB.update('users', userId, { schoolIds: ids, schoolId: ids[0] || null });
  // Mirror of the sync in addSchoolToUser — only clear headTeacherId if it still
  // points at this HT, so we don't stomp on a different HT's assignment.
  if (u.role === 'head_teacher') {
    const school = APP.data.schools.find(s => s.id === schoolId);
    if (school && school.headTeacherId === userId) { school.headTeacherId = null; await DB.update('schools', schoolId, { headTeacherId: null }); }
  }
  showToast('School removed.', 'success'); openModal('manage_schools', userId); syncData(false);
}

async function resetTestData() { return withBusyGuard(() => resetTestData_impl()); }
async function resetTestData_impl() {
  // Hard safety net: this must never run against the production project,
  // even if the Danger Zone button were somehow made visible (e.g. old
  // cached build, dev tools, future code change). The button itself is
  // already hidden via IS_PROD above — this is the backstop.
  if (IS_PROD) {
    showToast('Reset test data is disabled on production.', 'danger');
    return;
  }
  const confirmText = document.getElementById('reset-confirm-text')?.value.trim();
  if (confirmText !== 'RESET') { showToast('Please type RESET exactly to confirm.', 'danger'); return; }
  const keepSeedStructure = document.getElementById('reset-keep-seed-structure')?.checked;

  showToast('Resetting test data — this may take a moment…');

  try {
    // Always fully wipe the transactional/testing-only collections.
    for (const col of RESET_ALWAYS_WIPE_COLLECTIONS) {
      const docs = await DB.getAll(col);
      await Promise.all(docs.map(d => DB.del(col, d.id)));
    }
    // For structural collections, always protect the 4 seed users; optionally
    // also protect the seed org/school/teacher records.
    for (const col of ['orgs', 'schools', 'teachers', 'users']) {
      const protectedIds = col === 'users' ? SEED_PROTECTED_IDS.users : (keepSeedStructure ? SEED_PROTECTED_IDS[col] : []);
      const docs = await DB.getAll(col);
      const toDelete = docs.filter(d => !protectedIds.includes(d.id));
      await Promise.all(toDelete.map(d => DB.del(col, d.id)));
    }
    showToast('Test data reset. Reloading…', 'success');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    console.error('resetTestData failed:', err);
    showToast('Reset failed partway through — check the console and your connection, then try again.', 'danger');
  }
}

// ─── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('root').innerHTML = `<div class="loading-wrap"><div class="spinner"></div><p>Loading VTMS…</p></div>`;
  if (!isConfigured) { renderSetupScreen(); return; }
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    auth = getAuth(app);
    functionsInstance = getFunctions(app);
    // TEMP DEBUG: exposes the live auth object in the browser console so we
    // can check window.__VTMS_AUTH.currentUser?.email / .uid at any moment,
    // e.g. right before clicking "Reset password", to see whether it matches
    // who the screen is showing as logged in. Safe to remove once the
    // session-mismatch bug is fully tracked down.
    window.__VTMS_AUTH = auth;
    // CRITICAL: Firebase Auth's default persistence (IndexedDB/localStorage)
    // is shared across every tab of the same browser for the same project —
    // signing in on one tab silently becomes the signed-in account for every
    // other open tab too, even though each tab's own on-screen "who am I"
    // display doesn't update to match (that's separate, per-tab JS state).
    // This is exactly what caused the vCrop Admin tab to keep showing "vCrop
    // Admin" while its real login had been silently swapped out by signing
    // in elsewhere in another tab. Session-only persistence ties the login to
    // this one tab's sessionStorage instead, which is never shared with other
    // tabs — the trade-off is that closing the tab signs you out (no
    // "remembered" login across browser restarts), which is the right
    // trade-off for an admin tool like this.
    await setPersistence(auth, browserSessionPersistence);
    await seedIfEmpty();
    await loadAll();
    render();
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="loading-wrap"><div class="alert alert-danger" style="max-width:420px"><i class="ti ti-alert-circle"></i> Firebase connection failed: ${err.message}<br><br>Check your config values in index.html</div></div>`;
  }
}

// ─── GDRIVE LINK CONVERTER ───────────────────────────────────────────────────
function getPreviewUrl(url) {
  if (!url) return null;
  // Google Drive: https://drive.google.com/file/d/FILE_ID/view?...
  // → https://drive.google.com/file/d/FILE_ID/preview
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) {
    return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  }
  // Google Drive open link: https://drive.google.com/open?id=FILE_ID
  const openMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if (openMatch) {
    return `https://drive.google.com/file/d/${openMatch[1]}/preview`;
  }
  // OneDrive: convert to embed
  if (url.includes('1drv.ms') || url.includes('onedrive.live.com')) {
    return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
  }
  // Dropbox: change dl=0 to raw=1
  if (url.includes('dropbox.com')) {
    return url.replace('dl=0','raw=1').replace('www.dropbox.com','dl.dropboxusercontent.com');
  }
  // Default: return as-is
  return url;
}

function getDirectUrl(url) {
  if (!url) return null;
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
  const openMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if (openMatch) return `https://drive.google.com/uc?export=download&id=${openMatch[1]}`;
  return url;
}


// ─── NOTIFICATIONS MODULE ────────────────────────────────────────────────────



async function createNotificationForReq(type, title, message, rq, excludeUserId) {
  // Dedicated function for requirement notifications
  const now = new Date().toISOString();
  const targets = new Set();
  console.log('[VTMS] createNotificationForReq:', title, '| rq.id:', rq.id, '| excludeUserId:', excludeUserId, '| rq.createdBy:', rq.createdBy, '| rq.schoolId:', rq.schoolId);

  // 1. Notify vCrop Admin (by role)
  APP.data.users
    .filter(u => u.role === 'vcrop_admin' && u.id !== excludeUserId && !u.disabled)
    .forEach(u => { targets.add(u.id); console.log('[VTMS] Target vCrop Admin:', u.name, u.id); });

  // 2. Notify whoever actually raised this requirement — a requirement can be raised by
  // either the Head Teacher OR the Cluster Coordinator, so createdBy must never be
  // assumed to always be the HT.
  if (rq.createdBy && rq.createdBy !== excludeUserId) {
    targets.add(rq.createdBy);
    console.log('[VTMS] Target createdBy (raiser):', rq.createdBy);
  }

  // 3. ALWAYS also notify the school's current Head Teacher, as its own target
  // independent of who raised the requirement — this used to only run as a fallback
  // when createdBy was missing, which meant a CC-raised requirement never reached the
  // HT at all (the CC's own id was silently standing in for "notify the HT"). Using a
  // Set means this naturally collapses to one notification when the HT is also the
  // raiser. getHTForSchool checks both schoolIds[] and schoolId, so this also catches a
  // Head Teacher added to this school later via Manage Schools.
  const sch = APP.data.schools.find(s => s.id === rq.schoolId);
  const ht = sch ? getHTForSchool(sch.id) : null;
  if (ht && ht.id !== excludeUserId) {
    targets.add(ht.id);
    console.log('[VTMS] Target Head Teacher:', ht.name, ht.id);
  }

  // 4. Notify the Cluster Coordinator assigned to this school, if any
  const assignedCC = getCCForSchool(rq.schoolId);
  console.log('[VTMS] Assigned CC for school', rq.schoolId, ':', assignedCC ? assignedCC.name + ' (' + assignedCC.id + ')' : 'none found');
  if (assignedCC && assignedCC.id !== excludeUserId) {
    targets.add(assignedCC.id);
  }

  for (const userId of targets) {
    const notif = {
      id: uid(), type, title, message,
      forUserId: userId, relatedId: rq.id,
      read: false, createdAt: now,
      createdBy: APP.user ? APP.user.id : null,
      createdByName: APP.user ? APP.user.name : null,
    };
    try {
      await DB.set('notifications', notif.id, notif);
      APP.data.notifications.push(notif);
    } catch(err) {
      console.error('Notification error:', err);
    }
  }
}

async function createNotificationDirect(type, title, message, relatedId, excludeUserId, directUserId, extraRoles) {
  // Notify a specific user directly (by userId) + any extra roles
  const now = new Date().toISOString();
  const targets = new Set();
  // Add direct user (e.g. requirement creator)
  if (directUserId && directUserId !== excludeUserId) targets.add(directUserId);
  // Add all users with extraRoles (e.g. vcrop_admin)
  if (extraRoles && extraRoles.length) {
    APP.data.users.filter(u => extraRoles.includes(u.role) && u.id !== excludeUserId && !u.disabled)
      .forEach(u => targets.add(u.id));
  }
  for (const uid2 of targets) {
    const notif = {
      id: uid(), type, title, message,
      forUserId: uid2, relatedId: relatedId || null,
      read: false, createdAt: now,
      createdBy: APP.user ? APP.user.id : null,
      createdByName: APP.user ? APP.user.name : null,
    };
    await DB.set('notifications', notif.id, notif);
    APP.data.notifications.push(notif);
  }
}

async function createNotification(type, title, message, forRoles, relatedId, excludeUserId) {
  // Find the related school/org for scoping notifications
  let relatedSchoolId = null;
  let relatedOrgId = null;
  if (relatedId) {
    // Try requirement
    const req = APP.data.requirements.find(r => r.id === relatedId);
    if (req && req.schoolId) {
      relatedSchoolId = req.schoolId;
      const sch = APP.data.schools.find(s => s.id === req.schoolId);
      if (sch) relatedOrgId = sch.orgId;
    }
    // Try resume → requirement
    if (!relatedSchoolId) {
      const res = (APP.data.resumes || []).find(r => r.id === relatedId);
      if (res && res.requirementId) {
        const req2 = APP.data.requirements.find(r => r.id === res.requirementId);
        if (req2 && req2.schoolId) {
          relatedSchoolId = req2.schoolId;
          const sch2 = APP.data.schools.find(s => s.id === req2.schoolId);
          if (sch2) relatedOrgId = sch2.orgId;
        }
      }
    }
    // Try attendance record
    if (!relatedSchoolId) {
      const attRec = (APP.data.attendance || []).find(a => a.id === relatedId);
      if (attRec && attRec.schoolId) {
        relatedSchoolId = attRec.schoolId;
        const schA = APP.data.schools.find(s => s.id === attRec.schoolId);
        if (schA) relatedOrgId = schA.orgId;
      }
    }
    // Try teacher allocation (relatedId = teacher id)
    if (!relatedSchoolId) {
      const teacher = APP.data.teachers.find(t => t.id === relatedId);
      if (teacher && teacher.allocations) {
        const activeAlloc = teacher.allocations.find(a => a.active);
        if (activeAlloc) {
          relatedSchoolId = activeAlloc.schoolId;
          const sch3 = APP.data.schools.find(s => s.id === activeAlloc.schoolId);
          if (sch3) relatedOrgId = sch3.orgId;
        }
      }
    }
  }

  const targetUsers = APP.data.users.filter(u => {
    if (u.id === excludeUserId) return false;
    if (!forRoles.includes(u.role)) return false;
    if (u.disabled === true) return false;
    // vcrop_admin gets all notifications - no scoping
    if (u.role === 'vcrop_admin') return true;
    // org_admin: only notify if same org
    if (u.role === 'org_admin') {
      if (relatedOrgId && u.orgId !== relatedOrgId) return false;
      return true;
    }
    // head_teacher: only notify if same school (check both legacy schoolId and schoolIds[])
    if (u.role === 'head_teacher') {
      if (!relatedSchoolId) return true;
      const htSchools = (u.schoolIds && u.schoolIds.length) ? u.schoolIds : (u.schoolId ? [u.schoolId] : []);
      return htSchools.includes(relatedSchoolId);
    }
    // cluster_coordinator: only notify if the school is in their assigned schools
    if (u.role === 'cluster_coordinator') {
      if (!relatedSchoolId) return true;
      const ccSchools = (u.schoolIds && u.schoolIds.length) ? u.schoolIds : (u.schoolId ? [u.schoolId] : []);
      return ccSchools.includes(relatedSchoolId);
    }
    // teacher: only notify if same school
    if (u.role === 'teacher') {
      if (relatedSchoolId && u.schoolId !== relatedSchoolId) return false;
      return true;
    }
    return true;
  });

  const now = new Date().toISOString();
  for (const u of targetUsers) {
    const notif = {
      id: uid(),
      type: type,          // 'requirement', 'resume', 'password_reset'
      title: title,
      message: message,
      forUserId: u.id,
      relatedId: relatedId || null,
      read: false,
      createdAt: now,
      createdBy: APP.user ? APP.user.id : null,
      createdByName: APP.user ? APP.user.name : null,
    };
    await DB.set('notifications', notif.id, notif);
    APP.data.notifications.push(notif);
  }
}

function getMyNotifications() {
  if (!APP.user) return [];
  return (APP.data.notifications || [])
    .filter(n => n.forUserId === APP.user.id)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function getUnreadCount(type) {
  const notifs = getMyNotifications();
  if (type) return notifs.filter(n => !n.read && n.type === type).length;
  // password_reset notifications are excluded here — they're never individually
  // clickable/markable-read (buildPwResetSection renders the real actionable card
  // instead), so their `read` flag would otherwise stay stuck at false forever. The
  // real "is this actually still pending?" signal is the request's own status field,
  // added separately wherever this count feeds a badge (see updateBellBadge).
  return notifs.filter(n => !n.read && n.type !== 'password_reset').length;
}

async function markNotifRead(notifId) {
  const n = APP.data.notifications.find(n => n.id === notifId);
  if (!n || n.read) return;
  n.read = true;
  await DB.update('notifications', notifId, { read: true });
  render();
}

// Deep-links a notification to the record it's actually about, instead of just marking
// it read. Only wired up for the three types that already have a single-record "View"
// modal to open (attendance/issue/requirement) — cancellation/allocation/deallocation/
// resume don't have one yet, so those fall back to the old mark-read-only behavior.
const NOTIF_TYPE_TARGET = {
  attendance:  { page: 'attendance',   modal: 'view_att',   find: id => (APP.data.attendance || []).find(a => a.id === id) },
  issue:       { page: 'issues',       modal: 'view_issue', find: id => (APP.data.issues || []).find(i => i.id === id) },
  requirement: { page: 'requirements', modal: 'view_req',   find: id => (APP.data.requirements || []).find(r => r.id === id) },
};
async function goToNotification(notifId) {
  const n = APP.data.notifications.find(x => x.id === notifId);
  if (!n) return;
  if (!n.read) {
    n.read = true;
    await DB.update('notifications', notifId, { read: true });
  }
  const target = NOTIF_TYPE_TARGET[n.type];
  if (!target || !n.relatedId) { render(); return; }
  const record = target.find(n.relatedId);
  if (!record) {
    showToast('That record is no longer available.', 'danger');
    render();
    return;
  }
  nav(target.page);
  await openModal(target.modal, n.relatedId);
}

function filterNotifs(q) {
  // Previously this hid/showed already-rendered .notif-item DOM nodes in place — that
  // only worked because every notification was always rendered at once. Now that
  // Notifications is paginated, only the current page's ~30 items even exist in the
  // DOM, so in-place hiding would silently miss matches sitting on other pages. This
  // now does a real state update + full re-render instead, same pattern as setSearch(),
  // including resetting back to page 1 so a search never gets stranded on a stale page.
  APP.search['notifications'] = q;
  // Pagination is keyed per-tab ('notifications-all', 'notifications-requirement', etc.
  // — see renderNotifications), not a single flat 'notifications' key, so the reset must
  // target the SAME key that tab is actually paginated under, computed the same way.
  const tab = APP.tab || 'all';
  APP.pagination['notifications-' + tab] = 1;
  const inputEl = document.getElementById('notif-search');
  const cursorPos = inputEl ? inputEl.selectionStart : null;
  render();
  const newInput = document.getElementById('notif-search');
  if (newInput) {
    newInput.focus();
    if (cursorPos !== null) { try { newInput.setSelectionRange(cursorPos, cursorPos); } catch(e) {} }
  }
}

async function markAllNotifRead(type) {
  const mine = getMyNotifications().filter(n => !n.read && (!type || n.type === type));
  for (const n of mine) {
    n.read = true;
    await DB.update('notifications', n.id, { read: true });
  }
  render();
}

  const reqs = (APP.data.resetRequests||[])
    .filter(r => tab === 'all' ? r.status === 'pending' : true)

  return `<div class="sep"></div>
    <div style="font-size:11px;font-weight:600;color:#92400E;text-transform:uppercase;margin:8px 0 6px;letter-spacing:.05em">🔑 Password reset requests (${reqs.length})</div>
    ${reqs.map(r => `<div class="mob-item" style="margin-bottom:8px;border-left:3px solid ${r.status==='pending'?'#F59E0B':'#aaa'}">
      <div class="mob-item-header"><div>
        <div class="mob-item-title">${r.userName}</div>
        <div class="mob-item-sub">${r.userEmail} · ${fmtDT(r.requestedAt)}</div>
      </div><span class="badge ${r.status==='pending'?'b-amber':'b-green'}">${r.status==='pending'?'Pending':'Resolved'}</span></div>
      ${r.status === 'pending' ? `<div class="mob-item-actions">
        <button class="btn btn-sm" style="color:#7C3AED;background:#EDE9FE;border-color:#DDD6FE" onclick="openModal('reset_password','${r.userId}')"><i class="ti ti-key"></i> Reset pwd</button>
        <button class="btn btn-sm" style="color:var(--green);background:#F0FDF4;border-color:#BBF7D0" onclick="resolveResetRequest('${r.id}')"><i class="ti ti-check"></i> Resolved</button>

function renderNotifications() {
  const all = getMyNotifications();
  const tab = APP.tab || 'all';
  const isTeacher = role() === 'teacher';
  const tabs = isTeacher ? [
    { id: 'all',          label: 'All',               count: all.filter(n=>!n.read).length },
    { id: 'attendance',   label: 'Attendance',         count: all.filter(n=>!n.read&&n.type==='attendance').length },
    { id: 'cancellation', label: 'Class Cancellations',count: all.filter(n=>!n.read&&n.type==='cancellation').length },
    { id: 'allocation',   label: 'Allocated',          count: all.filter(n=>!n.read&&n.type==='allocation').length },
    { id: 'deallocation', label: 'De-allocated',       count: all.filter(n=>!n.read&&n.type==='deallocation').length },
    { id: 'issue',        label: 'Issues',             count: all.filter(n=>!n.read&&n.type==='issue').length },
  ] : [
    { id: 'all',            label: 'All',            count: all.filter(n=>!n.read&&n.type!=='password_reset').length + (role()==='vcrop_admin' ? (APP.data.resetRequests||[]).filter(r=>r.status==='pending').length : 0) },
    { id: 'requirement',    label: 'Requirements',   count: all.filter(n=>!n.read&&n.type==='requirement').length },
    { id: 'resume',         label: 'Resumes',        count: all.filter(n=>!n.read&&n.type==='resume').length },
    ...(role()!=='cluster_coordinator' ? [{ id: 'attendance', label: 'Attendance', count: all.filter(n=>!n.read&&n.type==='attendance').length }] : []),
    ...(role()==='vcrop_admin' ? [{ id: 'password_reset', label: 'Password resets', count: (APP.data.resetRequests||[]).filter(r=>r.status==='pending').length }] : []),
    { id: 'cancellation', label: 'Cancelled classes', count: all.filter(n=>!n.read&&n.type==='cancellation').length },
    { id: 'issue', label: 'Issues', count: all.filter(n=>!n.read&&n.type==='issue').length },
  ];
  // password_reset notifications are deliberately excluded from the generic card list
  // below — buildPwResetSection() already renders these with full Reset/Resolved
  // buttons, so showing them again here would just be a redundant, button-less
  // duplicate sitting above the actual actionable card. They still count normally
  // toward unread badges/tab counts (via `all`/`filtered` above), just not re-rendered.
  const filtered = tab === 'all' ? all : all.filter(n => n.type === tab);
  const q = (APP.search['notifications'] || '').toLowerCase();
  const searched = (q ? filtered.filter(n => (n.title||'').toLowerCase().includes(q) || (n.message||'').toLowerCase().includes(q)) : filtered)
    .filter(n => n.type !== 'password_reset');
  const unreadFiltered = filtered.filter(n => !n.read).length;
  const pageKey = 'notifications-' + tab;
  const { pageItems, currentPage, totalPages, totalCount, pageSize } = paginate(searched, pageKey, 30);

  const typeIcon = { requirement:'ti-file-description', resume:'ti-file-cv', password_reset:'ti-key', attendance:'ti-calendar-check', cancellation:'ti-calendar-x', allocation:'ti-building-plus', deallocation:'ti-building-minus', issue:'ti-alert-triangle', default:'ti-bell' };
  const typeColor = { requirement:'#1E40AF', resume:'#5B21B6', password_reset:'#92400E', attendance:'#166534', cancellation:'#DC2626', allocation:'#0D9488', deallocation:'#92400E', issue:'#B45309', default:'#555' };

  return `
  <div class="tab-bar">${tabs.map(t => `<div class="tab${APP.tab===t.id||(tab==='all'&&t.id==='all')?' active':''}" onclick="setTab('${t.id}')">
    ${t.label}${t.count > 0 ? ` <span style="background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:3px">${t.count}</span>` : ''}
  </div>`).join('')}</div>
  <div style="padding:8px 0 4px">
    <div style="position:relative">
      <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:14px"></i>
      <input class="form-control" id="notif-search" style="padding-left:32px" placeholder="Search notifications..." value="${APP.search['notifications']||''}" oninput="filterNotifs(this.value)">
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">${tab === 'all' ? 'All notifications' : tabs.find(t=>t.id===tab)?.label} (<span id="notif-count">${tab === 'password_reset' ? (APP.data.resetRequests||[]).length : searched.length}${q && tab !== 'password_reset' ? ' of '+filtered.length : ''}</span>)</span>
      ${unreadFiltered > 0 ? `<button class="btn btn-sm" onclick="markAllNotifRead('${tab==='all'?'':tab}')"><i class="ti ti-checks"></i> Mark all read</button>` : ''}
    </div>
    <div id="notif-empty" style="${searched.length === 0 && !(role() === 'vcrop_admin' && (tab === 'all' || tab === 'password_reset') && (APP.data.resetRequests||[]).length > 0) ? '' : 'display:none'}"><div class="empty-state"><i class="ti ti-bell-off"></i><p>No notifications</p></div></div>
    ${pageItems.length > 0 ? pageItems.map(n => {
        const icon = typeIcon[n.type] || typeIcon.default;
        const color = typeColor[n.type] || typeColor.default;
        const isLinkable = !!(NOTIF_TYPE_TARGET[n.type] && n.relatedId);
        return `<div class="mob-item notif-item" data-title="${(n.title||'').replace(/"/g,'&quot;')}" data-msg="${(n.message||'').replace(/"/g,'&quot;')}" style="margin-bottom:8px;cursor:pointer;${!n.read?'border-left:3px solid '+color+';':''}" onclick="goToNotification('${n.id}')">
          <div class="mob-item-header">
            <div style="display:flex;align-items:flex-start;gap:8px">
              <div style="width:32px;height:32px;border-radius:8px;background:${color}18;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">
                <i class="ti ${icon}" style="font-size:15px;color:${color}"></i>
              </div>
              <div>
                <div style="font-size:13px;font-weight:${!n.read?'600':'400'};color:${!n.read?'var(--text)':'var(--text2)'}">${n.title}</div>
                <div style="font-size:12px;color:var(--text2);margin-top:2px">${n.message}</div>
                <div style="font-size:11px;color:#aaa;margin-top:3px">${fmtDT(n.createdAt)}${n.createdByName ? ' · by '+n.createdByName : ''}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              ${!n.read ? '<span style="width:8px;height:8px;border-radius:50%;background:'+color+';flex-shrink:0;display:block"></span>' : ''}
              ${isLinkable ? '<i class="ti ti-chevron-right" style="font-size:14px;color:#bbb"></i>' : ''}
            </div>
          </div>
        </div>`;
      }).join('') + renderPaginationControls(pageKey, currentPage, totalPages, totalCount, pageSize)
    : ''}
        ${role() === 'vcrop_admin' && (tab === 'all' || tab === 'password_reset') ? buildPwResetSection(tab) : ''}
  </div>`;
}

async function updateResumeStatus(resId, newStatus, reason, reqId) { return withBusyGuard(() => updateResumeStatus_impl(resId, newStatus, reason, reqId)); }
async function updateResumeStatus_impl(resId, newStatus, reason, reqId) {
  const res = (APP.data.resumes || []).find(r => r.id === resId);
  if (!res) return;
  const now = new Date().toISOString();
  const r = role();
  let updates = {};
  if (newStatus === 'shortlisted') {
    // Each role gets independent slot (one-way, no undo)
    if (r === 'org_admin' || r === 'vcrop_admin') {
      if (res.orgShortlisted) { showToast('Already shortlisted by Org Admin.', 'danger'); return; }
      updates = { orgShortlisted: true, orgShortlistedByName: APP.user.name, orgShortlistedAt: now };
    } else if (r === 'cluster_coordinator') {
      if (res.ccShortlisted) { showToast('Already shortlisted by you.', 'danger'); return; }
      updates = { ccShortlisted: true, ccShortlistedByName: APP.user.name, ccShortlistedAt: now };
    } else if (r === 'head_teacher') {
      if (res.htShortlisted) { showToast('Already shortlisted by you.', 'danger'); return; }
      updates = { htShortlisted: true, htShortlistedByName: APP.user.name, htShortlistedAt: now };
    }
    if (!['school_selected','final_selected','rejected'].includes(res.status)) {
      updates.status = 'shortlisted';
    }
  } else if (newStatus === 'school_selected') {
    const isShortlisted = res.orgShortlisted || res.ccShortlisted || res.htShortlisted || res.status === 'shortlisted';
    if (!isShortlisted) { showToast('This candidate must be shortlisted before selecting.', 'danger'); return; }
    updates = { status: 'school_selected', schoolSelected: true, schoolSelectedByName: APP.user.name, schoolSelectedAt: now, schoolSelectedRole: r };
  } else if (newStatus === 'final_selected') {
    const isShortlisted = res.orgShortlisted || res.ccShortlisted || res.htShortlisted || res.status === 'shortlisted' || res.status === 'school_selected';
    if (!isShortlisted) { showToast('This candidate must be shortlisted before final selection.', 'danger'); return; }
    if (res.status !== 'school_selected') { showToast('This candidate must be selected at school level first.', 'danger'); return; }
    updates = { status: 'final_selected', finalSelected: true, finalSelectedByName: APP.user.name, finalSelectedAt: now };
  } else if (newStatus === 'rejected') {
    updates = { status: 'rejected', rejectedByName: APP.user.name, rejectedAt: now, rejectionReason: reason || null };
  }
  Object.assign(res, updates);
  await DB.update('resumes', resId, updates);
  const msgs = { shortlisted: 'Shortlisted', school_selected: 'Selected (school)', final_selected: '⭐ Final Selected', rejected: '❌ Rejected' };
  showToast(msgs[newStatus] || 'Updated.', newStatus === 'rejected' ? 'danger' : 'success');

  // Notify everyone else involved in this requirement's resume workflow
  const rqN = APP.data.requirements.find(rr => rr.id === (res.requirementId || reqId));
  const schN = rqN ? APP.data.schools.find(sc => sc.id === rqN.schoolId) : null;
  const ctx = rqN ? rqN.subject + ' (Gr.' + rqN.grade + ')' + (schN ? ' at ' + schN.name : '') : 'a requirement';
  const roleLabelMap = { vcrop_admin: 'vCrop Admin', org_admin: 'Org Admin', cluster_coordinator: 'CC', head_teacher: 'Head Teacher' };
  const actorLabel = roleLabelMap[r] || r;
  const notifTitles = {
    shortlisted: 'Candidate shortlisted',
    school_selected: 'Candidate selected (school level)',
    final_selected: 'Candidate final selected',
    rejected: 'Candidate rejected'
  };
  const notifMsg = actorLabel + ' (' + APP.user.name + ') ' + (msgs[newStatus] || 'updated').toLowerCase() + ' candidate ' + res.candidateName + ' for ' + ctx + (newStatus === 'rejected' && reason ? '. Reason: ' + reason : '');
  if (notifTitles[newStatus]) {
    await createNotification(
      'resume',
      notifTitles[newStatus],
      notifMsg,
      ['vcrop_admin', 'org_admin', 'cluster_coordinator', 'head_teacher'],
      res.id,
      APP.user.id
    );
  }

  APP.data.resumes = (await getDocs(collection(db, 'resumes'))).docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
  openModal('req_resumes', res.requirementId || reqId);
  syncData(false);
}

// ─── SMART DATA SYNC ─────────────────────────────────────────────────────────
// Uses polling (3 min, was 30s) instead of multiple onSnapshot listeners
// to avoid Firebase free-tier WebChannel connection limits (400 errors)

// ─── TARGETED INSTANT REFETCH ON NOTIFICATION ARRIVAL ──────────────────────
// Notifications arrive instantly via the always-on onSnapshot listener below,
// but the record they describe (an attendance approval, a new issue, etc.)
// otherwise only shows up on the next 3-min syncData() poll — so a user can
// see "Attendance approved" pop up and then look at a screen that hasn't
// caught up yet, which reads as a bug. Rather than opening MORE onSnapshot
// listeners (the exact thing that caused the 400 errors this file already
// moved away from), we piggyback on the one listener we already have: the
// instant it sees a brand-new notification, it fires a single one-time
// getDocs() against just the ONE collection that notification is about, and
// merges the result in immediately. This adds no persistent connections, and
// the added reads are bounded by how often real actions happen (event-driven),
// not by a fixed clock — unlike the full 10-collection poll below, which is
// already the dominant cost against the free-tier read quota regardless of
// whether anything changed. A short debounce coalesces bursts (e.g. several
// notifications firing off one action) into a single fetch per collection.
const NOTIF_TYPE_TO_COLLECTIONS = {
  attendance: ['attendance'],
  issue: ['issues'],
  deallocation: ['teachers'],
  // 'requirement' is reused by both the Requirements workflow and the direct
  // teacher-allocation notification ("Teacher allocated to school"), so both
  // source collections need refreshing when this type arrives.
  requirement: ['requirements', 'teachers'],
  cancellation: ['cancellations'],
  password_reset: ['password_reset_requests'],
  // 'resume' is intentionally omitted — the resumes collection already has
  // its own dedicated onSnapshot listener (startResumeListener), so it's
  // already instant and doesn't need a separate targeted fetch.
};
const COLLECTION_TO_APPDATA_KEY = {
  attendance: 'attendance',
  issues: 'issues',
  teachers: 'teachers',
  requirements: 'requirements',
  cancellations: 'cancellations',
  password_reset_requests: 'resetRequests',
};
let pendingTargetedRefetch = new Set();
let targetedRefetchTimer = null;
function queueTargetedRefetch(collNames) {
  if (!collNames || !collNames.length) return;
  collNames.forEach(c => pendingTargetedRefetch.add(c));
  if (targetedRefetchTimer) clearTimeout(targetedRefetchTimer);
  // 400ms debounce: if several notifications land together (e.g. one action
  // notifies multiple roles, or touches two collections), fetch each
  // collection once, not once per notification.
  targetedRefetchTimer = setTimeout(runTargetedRefetch, 400);
}
async function runTargetedRefetch() {
  const toFetch = Array.from(pendingTargetedRefetch);
  pendingTargetedRefetch.clear();
  targetedRefetchTimer = null;
  if (!toFetch.length || !db) return;
  try {
    const results = await Promise.all(toFetch.map(name => getDocs(collection(db, name))));
    results.forEach((snap, i) => {
      const key = COLLECTION_TO_APPDATA_KEY[toFetch[i]];
      if (!key) return;
      APP.data[key] = snap.docs.map((d, idx) => ({ id: d.id, _pos: idx, ...d.data() }));
    });
    // Same render guard as syncData(): don't disrupt an open modal, except the
    // known-safe read-only ones, which get a targeted refresh instead.
    const safeModals = ['req_resumes', 'view_req', 'view_att'];
    if (APP.modal && !safeModals.includes(APP.modal.type)) return;
    if (APP.modal && safeModals.includes(APP.modal.type)) {
      const modalEl = document.getElementById('modal-overlay');
      if (modalEl) modalEl.innerHTML = renderModal();
    } else {
      render();
    }
  } catch (err) { console.warn('[VTMS] Targeted refetch failed:', err); }
}

let notificationUnsubscribe = null;
let dataSyncInterval = null;
let lastActivity = Date.now();

// Track user activity to avoid polling when idle. If the user was idle long enough
// that syncData() had been skipping (see the idle guard inside syncData), the first
// click after they come back triggers an immediate catch-up fetch instead of making
// them wait for the next scheduled poll tick on top of however long they were away.
function onUserActivity() {
  const wasIdle = Date.now() - lastActivity > 10 * 60 * 1000;
  lastActivity = Date.now();
  if (wasIdle) syncData(false);
}
document.addEventListener('click', onUserActivity);
document.addEventListener('keydown', () => { lastActivity = Date.now(); });

// Manual refresh entry point for the topbar button — spins the icon, guarantees the
// fetch actually runs even if the tab had been idle long enough for syncData's idle
// guard to otherwise skip it (a click is obviously activity, but the click-driven
// lastActivity update in onUserActivity fires on the document AFTER this handler,
// since it's attached to the button itself — so lastActivity is bumped here explicitly
// rather than relying on that ordering), and confirms completion with a toast.
async function forceSyncNow() {
  lastActivity = Date.now();
  const icon = document.querySelector('#force-sync-btn i');
  if (icon) icon.style.animation = 'spin 0.6s linear infinite';
  await syncData(true);
  if (icon) icon.style.animation = '';
  showToast('Refreshed with the latest data.', 'success');
}

let firstSync = true;
async function syncData(forceRender = false) {
  if (!APP.user || !db) return;
  // Skip sync if user has been idle for more than 10 minutes
  if (Date.now() - lastActivity > 10 * 60 * 1000) return;
  // NOTE: the fetch below always runs regardless of whether a modal is open — it used
  // to return here before fetching anything whenever a non-safe modal was open, which
  // meant APP.data could go stale for the entire time the user had any modal open (and
  // stay stale afterward too, since it only gets refreshed on the NEXT successful poll).
  // The only thing that actually needs to respect an open modal is whether to disrupt
  // it with a re-render — see the render-guard down below — not whether to fetch at all.
  const safeModals = ['req_resumes', 'view_req', 'view_att'];
  try {
    // Fetch all collections in parallel
    const [requirements, attendance, resumes, cancellations, schools, teachers, users, orgs, resetReqs, issues] = await Promise.all([
      getDocs(collection(db, 'requirements')),
      getDocs(collection(db, 'attendance')),
      getDocs(collection(db, 'resumes')),
      getDocs(collection(db, 'cancellations')),
      getDocs(collection(db, 'schools')),
      getDocs(collection(db, 'teachers')),
      getDocs(collection(db, 'users')),
      getDocs(collection(db, 'orgs')),
      getDocs(collection(db, 'password_reset_requests')),
      getDocs(collection(db, 'issues')),
    ]);
    // Check if any data changed before re-rendering
    const newReqs = requirements.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newAtt  = attendance.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newRes  = resumes.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newCanc = cancellations.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newSch  = schools.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newTeach= teachers.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newUsers= users.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newOrgs = orgs.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newResetReqs = resetReqs.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));
    const newIssues = issues.docs.map((d,i) => ({id:d.id,_pos:i,...d.data()}));

    // Full-content comparison rather than checking specific fields (e.g. only
    // orgApproval, or only array length) — a hand-picked field list silently misses
    // real changes (this is exactly how headApproval-only updates and in-place
    // allocation edits went undetected before). Comparing the whole collection's JSON
    // catches any change anywhere, at a small, worthwhile CPU cost for this data size.
    const changed =
      JSON.stringify(newReqs)  !== JSON.stringify(APP.data.requirements) ||
      JSON.stringify(newAtt)   !== JSON.stringify(APP.data.attendance) ||
      JSON.stringify(newRes)   !== JSON.stringify(APP.data.resumes) ||
      JSON.stringify(newCanc)  !== JSON.stringify(APP.data.cancellations) ||
      JSON.stringify(newSch)   !== JSON.stringify(APP.data.schools) ||
      JSON.stringify(newTeach) !== JSON.stringify(APP.data.teachers) ||
      JSON.stringify(newUsers) !== JSON.stringify(APP.data.users) ||
      JSON.stringify(newOrgs)  !== JSON.stringify(APP.data.orgs) ||
      JSON.stringify(newResetReqs) !== JSON.stringify(APP.data.resetRequests) ||
      JSON.stringify(newIssues) !== JSON.stringify(APP.data.issues);

    APP.data.requirements  = newReqs;
    APP.data.attendance    = newAtt;
    APP.data.resumes       = newRes;
    APP.data.cancellations = newCanc;
    APP.data.schools       = newSch;
    APP.data.teachers      = newTeach;
    APP.data.users         = newUsers;
    APP.data.orgs          = newOrgs;
    APP.data.resetRequests = newResetReqs;
    APP.data.issues        = newIssues;

    if (changed || firstSync || forceRender) {
      firstSync = false;
      // If a safe (read-only) modal is open, re-render just the modal content
      if (APP.modal && safeModals.includes(APP.modal.type)) {
        const modalEl = document.getElementById('modal-overlay');
        if (modalEl) modalEl.innerHTML = renderModal();
      } else if (APP.modal) {
        // An unsafe modal (e.g. a form with in-progress input) is open — APP.data is
        // already fresh as of the assignment above, we just don't redraw right now to
        // avoid wiping whatever the user is mid-typing. The next render() call, whenever
        // they close this modal or navigate, will already reflect this fresh data.
      } else {
        // Don't re-render if user is actively typing in the notification search box
        const notifSearch = document.getElementById('notif-search');
        if (notifSearch && document.activeElement === notifSearch) {
          // Just re-run the filter to incorporate any new notifications
          setTimeout(() => filterNotifs(notifSearch.value), 100);
        } else {
          render();
        }
      }
    }
  } catch(e) { console.warn('[VTMS] syncData failed (will retry next cycle):', e); }
}

let resumeUnsubscribe = null;

function startResumeListener() {
  if (resumeUnsubscribe) { resumeUnsubscribe(); resumeUnsubscribe = null; }
  if (!APP.user || !db) return;
  let firstSnap = true;
  resumeUnsubscribe = onSnapshot(collection(db, 'resumes'), (snapshot) => {
    if (firstSnap) {
      APP.data.resumes = snapshot.docs.map((d, i) => ({ id: d.id, _pos: i, ...d.data() }));
      firstSnap = false;
      return;
    }
    let changed = false;
    snapshot.docChanges().forEach(change => {
      const item = { id: change.doc.id, ...change.doc.data() };
      if (change.type === 'added') {
        if (!APP.data.resumes.find(x => x.id === item.id)) { item._pos = APP.data.resumes.length; APP.data.resumes.push(item); changed = true; }
      } else if (change.type === 'modified') {
        const i = APP.data.resumes.findIndex(x => x.id === item.id);
        if (i >= 0) { APP.data.resumes[i] = item; changed = true; } else { APP.data.resumes.push(item); changed = true; }
      } else if (change.type === 'removed') {
        APP.data.resumes = APP.data.resumes.filter(x => x.id !== change.doc.id); changed = true;
      }
    });
    if (!changed) return;
    // If resume modal is open — refresh it instantly without full re-render
    if (APP.modal && APP.modal.type === 'req_resumes') {
      const modalEl = document.getElementById('modal-overlay');
      if (modalEl) { modalEl.innerHTML = renderModal(); return; }
    }
    if (APP.page === 'requirements' && !APP.modal) render();
  }, err => console.warn('[VTMS] Resume listener error:', err));
}

function startDataListeners() {
  stopDataListeners();
  if (!APP.user || !db) return;
  syncData();
  dataSyncInterval = setInterval(() => syncData(false), 300000); // 5 min (was 3 min, was 30s originally) — now mostly a safety-net poll, since the targeted notification-triggered refetch (see NOTIF_TYPE_TO_COLLECTIONS above) handles the time-sensitive collections instantly. schools/orgs/users have no notification coverage, so this interval is still their only freshness mechanism for other users viewing changes they didn't make themselves.
  startResumeListener();
  console.log('[VTMS] Real-time data listeners started');
}

function stopDataListeners() {
  if (dataSyncInterval) { clearInterval(dataSyncInterval); dataSyncInterval = null; }
  if (resumeUnsubscribe) { resumeUnsubscribe(); resumeUnsubscribe = null; }
}

function startNotificationListener() {
  if (notificationUnsubscribe) { notificationUnsubscribe(); notificationUnsubscribe = null; }
  if (!APP.user || !db) return;
  let firstSnapshot = true; // track initial load vs real-time updates
  const q = query(collection(db, 'notifications'), where('forUserId', '==', APP.user.id));
  notificationUnsubscribe = onSnapshot(q, (snapshot) => {
    if (firstSnapshot) {
      // Initial snapshot: Firebase sends ALL existing docs as 'added'
      // Replace APP.data.notifications with the authoritative Firestore data
      APP.data.notifications = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      firstSnapshot = false;
      updateBellBadge(); // always update badge on login
      return;
    }
    // Subsequent snapshots: only REAL changes (new/modified/deleted notifications)
    const newNotifTypes = new Set();
    snapshot.docChanges().forEach(change => {
      const notif = { id: change.doc.id, ...change.doc.data() };
      if (change.type === 'added') {
        if (!APP.data.notifications.find(n => n.id === notif.id)) {
          APP.data.notifications.push(notif);
        }
        if (notif.type) newNotifTypes.add(notif.type);
      } else if (change.type === 'modified') {
        const ex = APP.data.notifications.find(n => n.id === notif.id);
        if (ex) Object.assign(ex, notif);
        else APP.data.notifications.push(notif);
      } else if (change.type === 'removed') {
        APP.data.notifications = APP.data.notifications.filter(n => n.id !== change.doc.id);
      }
    });
    // Notifications arrive instantly (real-time), but the data they describe only
    // refreshes on the 3-min poll otherwise — see NOTIF_TYPE_TO_COLLECTIONS above for
    // why this fetches just the specific collection(s) each new notification type
    // touches, instead of opening another persistent listener or waiting on the poll.
    if (newNotifTypes.size) {
      const collsToFetch = new Set();
      newNotifTypes.forEach(t => (NOTIF_TYPE_TO_COLLECTIONS[t] || []).forEach(c => collsToFetch.add(c)));
      if (collsToFetch.size) queueTargetedRefetch(Array.from(collsToFetch));
    }
    updateBellBadge();
    // If user is currently viewing the notifications screen, refresh it live
    // but only if the search box is not focused (typing would lose focus on re-render)
    if (APP.page === 'notifications') {
      const searchEl = document.getElementById('notif-search');
      if (!searchEl || document.activeElement !== searchEl) {
        render();
      }
    }
  }, (err) => console.warn('Notification listener error:', err));
}

function stopNotificationListener() {
  if (notificationUnsubscribe) { notificationUnsubscribe(); notificationUnsubscribe = null; }
}

function updateBellBadge() {
  const unread = getUnreadCount();
  const resets = role() === 'vcrop_admin' ? (APP.data.resetRequests||[]).filter(r=>r.status==='pending').length : 0;
  const total = unread + resets;
  // Update badge elements - they always exist in DOM now (just hidden when 0)
  document.querySelectorAll('.bell-badge').forEach(b => {
    b.textContent = total || '';
    b.style.display = total > 0 ? 'flex' : 'none';
  });
  document.querySelectorAll('.notif-badge').forEach(b => {
    b.textContent = total || '';
    b.style.display = total > 0 ? 'inline-block' : 'none';
  });
  // If no badge elements found (e.g. page just loaded), do a lightweight topbar re-render
  const badges = document.querySelectorAll('.bell-badge, .notif-badge');
  if (badges.length === 0 && APP.user) {
    const topbar = document.querySelector('.topbar');
    if (topbar) topbar.innerHTML = renderTopbar().replace(/<div class="topbar">|<\/div>$/, '');
  }
}
