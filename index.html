// ── Cancellation form: populate subject dropdown from assigned-classes data ──
// If a teacher is already chosen, restrict to that teacher's assigned subjects.
// Otherwise show the union of all teachers' assigned subjects for the school.
function updateCancSubjects() {
  const school = document.getElementById('canc-school-specific')?.value;
  const subjSel = document.getElementById('canc-subject');
  if (!subjSel) return;
  const SUBJECTS = ['Accountancy','Biology','Business Studies','Chemistry','Computer','Economics','English','Geography','Hindi','History','Information Technology','Maths','Other Regional Languages','Physics','Political Science','Psychology','Sanskrit','Science','Social Science','Sociology'];
  if (!school) {
    subjSel.innerHTML = '<option value="">— Select school first —</option>';
    return;
  }
  const teacherId = document.getElementById('canc-teacher-specific')?.value;
  const prevVal = subjSel.value;
  let subjects = [];
  if (teacherId) {
    const t = APP.data.teachers.find(t => t.id === teacherId);
    const alloc = t ? (t.allocations || []).find(a => a.schoolId === school && a.active) : null;
    subjects = alloc ? [...new Set((alloc.assignedClasses || []).map(c => c.subject).filter(Boolean))] : [];
  } else {
    const allAssigned = [];
    APP.data.teachers.forEach(t => {
      const alloc = (t.allocations||[]).find(a => a.schoolId === school && a.active);
      if (alloc && alloc.assignedClasses) allAssigned.push(...alloc.assignedClasses);
    });
    subjects = [...new Set(allAssigned.map(c => c.subject).filter(Boolean))];
  }
  if (subjects.length > 0) {
    subjSel.innerHTML = '<option value="">— Select —</option>' + subjects.sort().map(s => `<option value="${s}">${s}</option>`).join('');
  } else {
    // No subject data recorded on any allocation yet — fall back to full master list
    subjSel.innerHTML = '<option value="">— Select —</option>' + SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  if (prevVal && Array.from(subjSel.options).some(o => o.value === prevVal)) subjSel.value = prevVal;
}

function updateAddRowBtn() {
  const dayStatus = document.getElementById('att-daystat-global')?.value;
  const disableForDay = dayStatus && dayStatus !== 'Working';
  const conductedEl = document.getElementById('att-conducted-global');
  const maxRows = conductedEl ? parseInt(conductedEl.value) || 0 : 0;
  const rows = document.querySelectorAll('.att-row');
  const currentRows = rows.length;

  // Auto-remove excess rows if conducted was reduced (keep first N rows)
  if (!disableForDay && maxRows > 0 && currentRows > maxRows) {
    const allRows = Array.from(rows);
    allRows.slice(maxRows).forEach(row => row.remove());
  }

  const newRowCount = document.querySelectorAll('.att-row').length;
  const addBtn = document.getElementById('att-add-row-btn');
  if (!addBtn) return;
  const disable = disableForDay || (maxRows > 0 && newRowCount >= maxRows);
  addBtn.disabled = disable;
  addBtn.style.opacity = disable ? '0.4' : '';
  addBtn.style.cursor = disable ? 'not-allowed' : '';
  if (!disableForDay && maxRows > 0) {
    addBtn.innerHTML = `<i class="ti ti-plus"></i> Add another class (${newRowCount}/${maxRows})`;
  } else {
    addBtn.innerHTML = `<i class="ti ti-plus"></i> Add another class`;
  }
}

function onHwLinkInput(input, idx) {
  const v = input.value.trim();
  const previewDiv = document.getElementById('att-hwlink-preview-' + idx);
  const previewA = document.getElementById('att-hwlink-a-' + idx);
  if (!previewDiv || !previewA) return;
  if (v.startsWith('http')) {
    previewA.href = v;
    previewDiv.style.display = '';
  } else {
    previewDiv.style.display = 'none';
  }
}

function wireAttHwLink(idx) {
  const input = document.getElementById('att-hwlink-' + idx);
  const previewDiv = document.getElementById('att-hwlink-preview-' + idx);
  const previewA = document.getElementById('att-hwlink-a-' + idx);
  if (!input || !previewDiv || !previewA) return;
  input.addEventListener('input', () => {
    const v = input.value.trim();
    if (v.startsWith('http')) {
      previewA.href = v;
      previewDiv.style.display = '';
    } else {
      previewDiv.style.display = 'none';
    }
  });
}
// Wire first row after render
setTimeout(() => wireAttHwLink(0), 100);

async function submitAttendance() { return withBusyGuard(() => submitAttendance_impl()); }
async function submitAttendance_impl() {
  const t = APP.data.teachers.find(t => t.userId === APP.user.id);
  if (!t) { showToast('No teacher profile linked.', 'danger'); return; }
  const school = document.getElementById('att-school')?.value;
  const date = document.getElementById('att-date')?.value;
  const globalAssigned = parseInt(document.getElementById('att-assigned-global')?.value);
  const globalConducted = parseInt(document.getElementById('att-conducted-global')?.value);
  const globalDayStatus = document.getElementById('att-daystat-global')?.value;
  if (!school) { showToast('Please select a school.', 'danger'); return; }
  if (!date) { showToast('Please select a date.', 'danger'); return; }
  if (date > today()) { showToast('Attendance date cannot be in the future.', 'danger'); return; }
  if (!globalAssigned) { showToast('Please enter classes assigned.', 'danger'); return; }
  if (isNaN(globalConducted)) { showToast('Please enter classes conducted.', 'danger'); return; }
  if (globalConducted > globalAssigned) { showToast(`Classes conducted (${globalConducted}) cannot be greater than classes assigned (${globalAssigned}).`, 'danger'); return; }
  if (!globalDayStatus) { showToast('Please select the day status.', 'danger'); return; }

  // Validate class rows count matches classes conducted (for working days)
  if (globalDayStatus === 'Working' && globalConducted > 0) {
    const rowCount = document.querySelectorAll('.att-row').length;
    if (rowCount > globalConducted) {
      showToast(`You have ${rowCount} class rows but Classes Conducted is ${globalConducted}. Please remove ${rowCount - globalConducted} row(s) or update Classes Conducted.`, 'danger');
      updateAddRowBtn();
      return;
    }
  }

  // For non-working days: block if ANY record already exists for same teacher + school + date
  if (globalDayStatus !== 'Working') {
    const existingAny = (APP.data.attendance || []).find(a =>
      a.schoolId === school && a.date === date && a.teacherId === t.id
    );
    if (existingAny) {
      const schName = (APP.data.schools.find(s => s.id === school) || {}).name || 'this school';
      const existingStatus = existingAny.dayStatus || 'Working';
      showToast(`Attendance already exists for ${fmtDate(date)} at ${schName} (${existingStatus}). You cannot submit again for the same date.`, 'danger');
      return;
    }
  }

  // For Working day: block if a non-working day record already exists for same teacher + school + date
  if (globalDayStatus === 'Working') {
    const existingNonWorking = (APP.data.attendance || []).find(a =>
      a.schoolId === school && a.date === date && a.teacherId === t.id && a.dayStatus !== 'Working'
    );
    if (existingNonWorking) {
      const schName = (APP.data.schools.find(s => s.id === school) || {}).name || 'this school';
      showToast(`A non-working day record (${existingNonWorking.dayStatus}) already exists for ${fmtDate(date)} at ${schName}. Cannot add a Working day record for the same date.`, 'danger');
      return;
    }
  }

  // Collect all visible class rows
  const rows = document.querySelectorAll('.att-row');
  if (!rows.length) { showToast('Please add at least one class.', 'danger'); return; }

  // Re-run all duplicate checks with latest field values before validating
  checkAllAttDuplicates();

  // Block if any visible row has a duplicate warning — scroll to first one
  const activeRows = document.querySelectorAll('.att-row');
  for (const row of activeRows) {
    const idx = row.id.replace('att-row-', '');
    const dupDiv = document.getElementById('att-dup-' + idx);
    if (dupDiv && dupDiv.style.display !== 'none') {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast('Duplicate found — please scroll up to see the highlighted class.', 'danger');
      return;
    }
  }

  const records = [];
  for (let i = 0; i < rows.length; i++) {
    const rowId = rows[i].id.replace('att-row-', '');
    const isNonWorking = globalDayStatus && globalDayStatus !== 'Working';
    const cls       = document.getElementById('att-cls-' + rowId)?.value.trim();
    const sec       = document.getElementById('att-sec-' + rowId)?.value.trim();
    const subject   = document.getElementById('att-subject-' + rowId)?.value.trim() || '';
    const dayStatus = globalDayStatus;
    const classStatus = isNonWorking ? globalDayStatus : document.getElementById('att-clsstatus-' + rowId)?.value;
    const durRaw    = document.getElementById('att-dur-' + rowId)?.value;
    const dur       = isNonWorking ? 0 : (durRaw === '' || durRaw === undefined ? NaN : parseInt(durRaw));
    const assigned  = globalAssigned;
    const conducted = globalConducted;
    const topics    = document.getElementById('att-topics-' + rowId)?.value.trim();
    const hw        = document.getElementById('att-hw-' + rowId)?.value.trim() || '';
    const hwLink    = document.getElementById('att-hwlink-' + rowId)?.value.trim() || '';
    const n = parseInt(rowId) + 1;
    if (!isNonWorking && !cls)         { showToast(`Class ${n}: please select the class.`, 'danger'); return; }
    if (!isNonWorking && !sec)         { showToast(`Class ${n}: please select the section.`, 'danger'); return; }
    if (!isNonWorking && !subject)     { showToast(`Class ${n}: please select the subject.`, 'danger'); return; }
    if (!isNonWorking && !classStatus) { showToast(`Class ${n}: please select the class status.`, 'danger'); return; }
    if (!isNonWorking && isNaN(dur))   { showToast(`Class ${n}: please select duration per class.`, 'danger'); return; }
    if (!topics)    { showToast(`Class ${n}: please fill topics taught / remark.`, 'danger'); return; }
    const markedAt = new Date().toISOString();
    records.push({ id: uid(), teacherId: t.id, schoolId: school, subject, date, day: dayName(date), cls, section: sec, dayStatus, classStatus, duration: dur, totalAssigned: assigned, totalConducted: conducted, topics, homework: hw, homeworkLink: hwLink, markedAt, headApproval: null, headApprovedAt: null, rejectionReason: null, history: [{ action: 'submitted', role: 'Teacher', by: APP.user.name, at: markedAt }] });
  }

  // Save all records in parallel
  await Promise.all(records.map(rec => DB.set('attendance', rec.id, rec)));
  records.forEach(rec => APP.data.attendance.push(rec));

  const isNonWorkingDay = globalDayStatus && globalDayStatus !== 'Working';

  // Auto-approve only the cases where there's genuinely nothing left for the Head
  // Teacher to decide:
  //  - School Holiday / On Leave (day-level, no class content at all — always auto)
  //  - Not Conducted (Teacher End): always the teacher's own reason, never billable,
  //    nothing to review — always auto
  //  - Cancelled / All Classes Cancelled WHERE a formal Class Cancellation record
  //    already exists: the Head Teacher already made this cancellation decision when
  //    they raised that record, so routing the resulting attendance row back to them
  //    would just be asking them to re-approve their own action
  // Everything else — Conducted, and Cancelled/All Classes Cancelled with NO formal
  // record behind it (a school/teacher-reported cancellation the HT hasn't seen or
  // acted on yet) — goes to the normal approval queue, since that's exactly the case
  // where HT oversight has real value. Billing itself stays fully independent of this
  // either way — see getRowBillability, which checks the formal Class Cancellation
  // record + advance-notice instead of headApproval.
  const autoApproveRecs = records.filter(rec => {
    if (rec.dayStatus === 'School Holiday' || rec.dayStatus === 'On Leave') return true;
    if (rec.classStatus === 'Not Conducted') return true;
    if (rec.classStatus === 'Cancelled' || rec.classStatus === 'All Classes Cancelled') {
      return !!findAttendanceCancellation(rec);
    }
    return false;
  });
  if (autoApproveRecs.length) {
    const autoAt = new Date().toISOString();
    await Promise.all(autoApproveRecs.map(rec => {
      const autoByLabel = (rec.dayStatus === 'School Holiday' || rec.dayStatus === 'On Leave')
        ? 'Auto (non-working day)'
        : rec.classStatus === 'Not Conducted'
          ? 'Auto (not conducted)'
          : 'Auto (Head Teacher-raised cancellation)';
      const hist = (rec.history || []).concat([{ action: 'approved', role: 'System', by: autoByLabel, at: autoAt }]);
      const autoApproveFields = { headApproval: 'approved', headApprovedAt: autoAt, headApprovedByName: autoByLabel, history: hist };
      Object.assign(rec, autoApproveFields);
      return DB.update('attendance', rec.id, autoApproveFields);
    }));
  }

  // Notifications
  const tSchool = APP.data.schools.find(s => s.id === school);
  const classInfo = records.length > 1 ? records.length + ' classes' : 'Class ' + records[0].cls + '-' + records[0].section;

  // School Holiday / On Leave are always fully auto-approved (day-level, single record,
  // no per-row variance) — their messaging stays simple. Working day and All Classes
  // Cancelled now share the same "might be pending, might be auto-approved" reality
  // (a formal Class Cancellation record decides it — see autoApproveRecs above), so they
  // share one accurate wording path based on anyStillPending instead of assuming from
  // the day status alone.
  if (globalDayStatus === 'On Leave') {
    const nonWorkMsg = APP.user.name + ' submitted attendance for ' + fmtDate(date) + (tSchool ? ' at ' + tSchool.name : '') + ', ' + classInfo + '. Day status: On Leave (auto-approved).';
    const htUserNW = APP.data.users.find(u => u.role === 'head_teacher' && !u.disabled &&
      ((u.schoolIds && u.schoolIds.includes(school)) || u.schoolId === school));
    if (htUserNW) {
      await DB.set('notifications', uid(), { type:'attendance', title:'Teacher on leave', message: nonWorkMsg, forUserId: htUserNW.id, relatedId: records[0].id, createdAt: new Date().toISOString(), read: false });
    }
    await createNotification('attendance', 'Teacher on leave', nonWorkMsg, ['org_admin', 'vcrop_admin'], records[0].id, t.userId || '');
  } else if (globalDayStatus === 'School Holiday') {
    const nonWorkMsg = APP.user.name + ' submitted attendance for ' + fmtDate(date) + (tSchool ? ' at ' + tSchool.name : '') + ', ' + classInfo + '. Day status: School Holiday (auto-approved).';
    const htUserNW3 = APP.data.users.find(u => u.role === 'head_teacher' && !u.disabled &&
      ((u.schoolIds && u.schoolIds.includes(school)) || u.schoolId === school));
    if (htUserNW3) {
      await DB.set('notifications', uid(), { type:'attendance', title:'Attendance submitted (auto-approved)', message: nonWorkMsg, forUserId: htUserNW3.id, relatedId: records[0].id, createdAt: new Date().toISOString(), read: false });
    }
    await createNotification('attendance', 'Attendance submitted (auto-approved)', nonWorkMsg, ['org_admin', 'vcrop_admin'], records[0].id, t.userId || '');
  } else {
    // Working day, or All Classes Cancelled: whether this needs Head Teacher approval
    // depends on whether a formal Class Cancellation record already exists for it (see
    // autoApproveRecs) — reflect that accurately instead of assuming from day status alone.
    const anyStillPending = autoApproveRecs.length < records.length;
    const subMsgHT  = APP.user.name + ' submitted attendance for ' + fmtDate(date) + (tSchool ? ' at ' + tSchool.name : '') + ', ' + classInfo + (anyStillPending ? '. Pending your approval.' : '. Auto-approved — no action needed.');
    const subMsgOrg = APP.user.name + ' submitted attendance for ' + fmtDate(date) + (tSchool ? ' at ' + tSchool.name : '') + ', ' + classInfo + (anyStillPending ? '. Pending Head Teacher approval first.' : '. Auto-approved.');
    const htUser = APP.data.users.find(u => u.role === 'head_teacher' && !u.disabled &&
      ((u.schoolIds && u.schoolIds.includes(school)) || u.schoolId === school));
    if (htUser) {
      await DB.set('notifications', uid(), { type:'attendance', title: anyStillPending ? 'Attendance submitted — pending your approval' : 'Attendance submitted (auto-approved)', message: subMsgHT, forUserId: htUser.id, relatedId: records[0].id, createdAt: new Date().toISOString(), read: false });
    }
    await createNotification('attendance', anyStillPending ? 'Attendance submitted — pending Head Teacher approval' : 'Attendance submitted (auto-approved)', subMsgOrg, ['org_admin', 'vcrop_admin'], records[0].id, t.userId || '');
  }

async function deleteAtt(id) {
  const a = APP.data.attendance.find(a => a.id === id);
  if (!a) return;
  await DB.del('attendance', id);
  APP.data.attendance = APP.data.attendance.filter(a => a.id !== id);
  showToast('Attendance record deleted.', 'danger');
  render();
}

async function approveAtt(id, action) {
  const a = APP.data.attendance.find(a => a.id === id);
  if (!a) return;
  // Head Teacher approval is now FINAL — the old second-stage Org Admin approval no
  // longer exists for anyone, including vCrop Admin's previous oversight override.
  // Only a Head Teacher can reach this function now (the Approve/Reject buttons
  // themselves are gated to head_teacher only — see renderPendingAttendance), but this
  // guard stays as a safety net in case that ever changes.
  if (role() !== 'head_teacher') { showToast('Only a Head Teacher can approve or reject attendance.', 'danger'); return; }
  const now = new Date().toISOString();
  const attSchool = APP.data.schools.find(s => s.id === a.schoolId);
  const attTeacher = APP.data.teachers.find(t => t.id === a.teacherId);
  const schoolName = attSchool ? attSchool.name : 'school';
  const attAction = action === 'approve' ? 'approved' : 'rejected';

  const histEntry = { action: attAction, role: 'Head Teacher', by: APP.user.name, at: now };
  if (action === 'reject' && a.rejectionReason) histEntry.reason = a.rejectionReason;
  const updates = { headApproval: attAction, headApprovedAt: now, headApprovedByName: APP.user.name, history: (a.history || []).concat([histEntry]) };
  if (action === 'reject' && a.rejectionReason) updates.rejectionReason = a.rejectionReason;
  Object.assign(a, updates);
  await DB.update('attendance', id, updates);

  const clsSec = 'Class ' + a.cls + '-' + a.section;
  const msgTeacher = action === 'approve'
    ? 'Head Teacher (' + APP.user.name + ') has fully approved your attendance for ' + fmtDate(a.date) + ', ' + clsSec + ' at ' + schoolName + '. No further action needed.'
    : 'Head Teacher (' + APP.user.name + ') rejected your attendance for ' + fmtDate(a.date) + ', ' + clsSec + ' at ' + schoolName + '. You can edit and resubmit.' + (a.rejectionReason ? ' Reason: ' + a.rejectionReason : '');
  const msgOthers = action === 'approve'
    ? 'Head Teacher (' + APP.user.name + ') has fully approved attendance for ' + fmtDate(a.date) + ', ' + clsSec + ' at ' + schoolName + '. No action needed.'
    : 'Head Teacher (' + APP.user.name + ') rejected attendance for ' + fmtDate(a.date) + ', ' + clsSec + ' at ' + schoolName + '.' + (a.rejectionReason ? ' Reason: ' + a.rejectionReason : '');
  const titleTeacher = action === 'approve' ? 'Attendance fully approved' : 'Attendance rejected by Head Teacher';
  const titleOthers  = action === 'approve' ? 'Attendance fully approved by Head Teacher' : 'Attendance rejected by Head Teacher';

  if (attTeacher && attTeacher.userId) {
    await DB.set('notifications', uid(), { type:'attendance', title: titleTeacher, message: msgTeacher, forUserId: attTeacher.userId, relatedId: id, createdAt: now, read: false });
  }
  // Org Admin and vCrop Admin are informed for visibility only — neither has any
  // action to take here anymore, HT's decision is final either way.
  await createNotification('attendance', titleOthers, msgOthers, ['org_admin', 'vcrop_admin'], id, APP.user.id);

  showToast(action === 'approve' ? 'Attendance approved!' : 'Attendance rejected.', action === 'approve' ? 'success' : 'danger');
  syncData(true);
}

// Generic sort helper for all screens
function applySort(arr, col, dir, getVal) {
  if (!col || !arr || !arr.length) return arr;
  const d = dir === 'asc' ? 1 : -1;
  return arr.slice().sort((a, b) => {
    if (a._e || b._e) return 0; // skip empty-state placeholders
    const va = String(getVal ? (getVal(a, col) || '') : (a[col] || ''));
    const vb = String(getVal ? (getVal(b, col) || '') : (b[col] || ''));
    if (va < vb) return -1 * d;
    if (va > vb) return 1 * d;
    return 0;
  });
}

function setSort(col) {
  if (APP.sort.col === col) {
    APP.sort.dir = APP.sort.dir === 'desc' ? 'asc' : 'desc';
  } else {
    APP.sort.col = col;
    APP.sort.dir = 'desc';
  }
  render();
}

function sortIcon(col) {
  if (APP.sort.col !== col) return '<i class="ti ti-arrows-sort" style="opacity:0.3;font-size:11px"></i>';
  return APP.sort.dir === 'desc'
    ? '<i class="ti ti-sort-descending" style="color:var(--blue);font-size:11px"></i>'
    : '<i class="ti ti-sort-ascending" style="color:var(--blue);font-size:11px"></i>';
}

function gradeLabel(g) {
  const map = { primary: 'Primary (1-5)', elementary: 'Elementary (6-10)', sr_secondary: 'Sr. Secondary (11-12)' };
  return map[g] || g || '—';
}

// Display-only label for Class Status — the stored value ('Cancelled'/'Not Conducted')
// never changes, this only affects what a human reads. Keeps clear who initiated a
// non-conducted class: the school (a formal decision) vs. the teacher (their own reason).
function classStatusLabel(status) {
  const map = { Cancelled: 'Cancelled from School End', 'Not Conducted': 'Not Conducted from Teacher End' };
  return map[status] || status || '—';
}

  const r = role();

  const mySchoolIds2 = APP.user.schoolIds || (APP.user.schoolId ? [APP.user.schoolId] : []);
  const allReqs = (r === 'vcrop_admin' ? APP.data.requirements :
    r === 'org_admin' ? APP.data.requirements.filter(rq => {
      const s = APP.data.schools.find(s => s.id === rq.schoolId); return s && s.orgId === APP.user.orgId;
    }) :
    (r === 'cluster_coordinator' || r === 'head_teacher') ? APP.data.requirements.filter(rq => mySchoolIds2.includes(rq.schoolId)) : [])
  .slice().sort((a, b) => {
    const col = APP.sort.col;
    const dir = APP.sort.dir === 'asc' ? 1 : -1;
    let va = '', vb = '';
    if (col === 'school') {
      const sa = APP.data.schools.find(s => s.id === a.schoolId);
      const sb2 = APP.data.schools.find(s => s.id === b.schoolId);
      va = sa ? sa.name : ''; vb = sb2 ? sb2.name : '';
    } else if (col === 'grade') {
      va = a.grade || ''; vb = b.grade || '';
    } else if (col === 'subject') {
      va = a.subject || ''; vb = b.subject || '';
    } else if (col === 'status') {
      va = a.status || ''; vb = b.status || '';
    } else {
      // Default: createdAt — newer items first, fallback to _pos
      const hasA = !!(a.createdAt || a.approvedAt);
      const hasB = !!(b.createdAt || b.approvedAt);
      if (hasA && hasB) return dir * (new Date(b.createdAt || b.approvedAt) - new Date(a.createdAt || a.approvedAt));
      if (hasA && !hasB) return -1;
      if (!hasA && hasB) return 1;
      return dir * ((b._pos || 0) - (a._pos || 0));
    }
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
  const reqs = allReqs.filter(rq => {
    if (!q) return true;
    const s = APP.data.schools.find(s => s.id === rq.schoolId);
    return (s && s.name.toLowerCase().includes(q)) || rq.subject.toLowerCase().includes(q) || rq.grade.toLowerCase().includes(q) || rq.status.toLowerCase().includes(q);

  ${searchBox('requirements', 'Search by school, subject, grade or status...')}

    <div class="desk-table table-wrap" style="${reqs.length === 0 ? 'display:none' : ''}"><table class="table">
    <thead><tr><th onclick="setSort('school')" style="cursor:pointer;user-select:none">${'School'} ${sortIcon('school')}</th><th onclick="setSort('grade')" style="cursor:pointer;user-select:none">${'Grade'} ${sortIcon('grade')}</th><th onclick="setSort('subject')" style="cursor:pointer;user-select:none">${'Subject'} ${sortIcon('subject')}</th><th>Count</th><th>Syllabus status</th><th onclick="setSort('status')" style="cursor:pointer;user-select:none">${'Status'} ${sortIcon('status')}</th><th onclick="setSort('createdAt')" style="cursor:pointer;user-select:none">${'Date'} ${sortIcon('createdAt')}</th><th>Actions</th></tr></thead>
    <tbody>${reqs.map(rq => {
      const s = APP.data.schools.find(s => s.id === rq.schoolId);
      const st = rq.status === 'completed' ? 'b-green' : rq.status === 'approved' ? 'b-blue' : rq.status === 'rejected' ? 'b-red' : rq.status === 'shortlisting' ? 'b-purple' : 'b-amber';
      const statusLabel = REQ_STATUS_LABELS[rq.status] || rq.status;
      return `<tr>
        <td>${s ? s.name : '—'}</td><td>${gradeLabel(rq.grade)}</td><td>${rq.subject}</td><td>${rq.count}</td>
        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rq.syllabusStatus}</td>
        <td><span class="badge ${st}">${statusLabel}</span>
          ${rq.approvedByName ? `<div style="font-size:10px;color:#555;margin-top:2px">by ${rq.approvedByName}</div>` : ''}
          ${rq.rejectedByName ? `<div style="font-size:10px;color:var(--red);margin-top:2px">by ${rq.rejectedByName}</div>` : ''}
        </td>
        <td style="font-size:11px;color:#888;white-space:nowrap">${rq.createdAt ? fmtDT(rq.createdAt) : '—'}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">
          ${r === 'cluster_coordinator' && rq.status === 'cc_pending' ? `<button class="btn btn-sm" style="color:#166534;border-color:#BBF7D0;background:#F0FDF4" onclick="ccApproveReq('${rq.id}')"><i class="ti ti-check"></i> Approve</button><button class="btn btn-sm btn-danger" onclick="openModal('reject_req','${rq.id}')"><i class="ti ti-x"></i> Reject</button>` : ''}
          ${(r === 'org_admin' || r === 'vcrop_admin') && rq.status === 'pending' ? `<button class="btn btn-sm" style="color:#166534;border-color:#BBF7D0;background:#F0FDF4" onclick="approveReq('${rq.id}')"><i class="ti ti-check"></i> Approve</button>` : ''}
          ${(r === 'org_admin' || r === 'vcrop_admin') && rq.status === 'pending' ? `<button class="btn btn-sm btn-danger" onclick="openModal('reject_req','${rq.id}')"><i class="ti ti-x"></i> Reject</button>` : ''}

          ${r === 'vcrop_admin' && rq.status === 'approved' ? `<button class="btn btn-sm" style="color:#5B21B6;background:#EDE9FE;border-color:#DDD6FE" onclick="openModal('req_resumes','${rq.id}')"><i class="ti ti-file-cv"></i> Resumes</button>` : ''}
          ${(r === 'head_teacher' || r === 'org_admin' || r === 'cluster_coordinator') && rq.status === 'approved' ? `<button class="btn btn-sm" style="color:#5B21B6;background:#EDE9FE;border-color:#DDD6FE" onclick="openModal('req_resumes','${rq.id}')"><i class="ti ti-file-cv"></i> Resumes</button>` : ''}

    <div class="mob-list">${reqs.length === 0 ? '' : reqs.slice().reverse().map(rq => {

// ─── Issues (pre-first-class coordination escalations) ─────────────────────
// Lets a Teacher or Head Teacher flag a problem that needs vCrop Admin, Org Admin,
// or Cluster Coordinator to step in on — timetable clashes, syllabus mismatches,
// missing books, calendar conflicts, etc. — during the gap between allocation and
// the first class, where today that coordination happens entirely over phone calls
// with zero visibility for anyone in an oversight role. Flow: Teacher/HT raises ->
// vCrop Admin + Org Admin + the school's CC (if any) are notified -> one of them
// marks it In Progress (optional acknowledgement step) -> then Resolved with notes
// -> the original reporter is notified back at each step.
function getMyIssues() {
  const r = role();
  const all = APP.data.issues || [];
  if (r === 'vcrop_admin') return all;
  if (r === 'org_admin') return all.filter(i => {
    const s = APP.data.schools.find(sc => sc.id === i.schoolId);
    return s && s.orgId === APP.user.orgId;
  });
  const mySchoolIds = APP.user.schoolIds || (APP.user.schoolId ? [APP.user.schoolId] : []);
  if (r === 'cluster_coordinator' || r === 'head_teacher') return all.filter(i => mySchoolIds.includes(i.schoolId));
  if (r === 'teacher') {
    const t = APP.data.teachers.find(t => t.userId === APP.user.id);
    return t ? all.filter(i => i.teacherId === t.id) : [];
  }
  return [];
}

function renderIssues() {
  const r = role();
  const q = getSearch('issues');
  const canRaise = r === 'teacher' || r === 'head_teacher';
  // Action ability depends on who raised the issue, not just the viewer's role:
  //  - vCrop Admin: can always act on anything, regardless of who raised it.
  //  - Issue raised BY a Head Teacher (against a teacher): only the subject Teacher and
  //    vCrop Admin can act on it — Org Admin, Cluster Coordinator and the raising HT
  //    themselves are excluded, since it's now purely a Teacher/vCrop matter.
  //  - Issue raised by a Teacher (about the school): Org Admin, Cluster Coordinator and
  //    Head Teacher can act on it, same as before; the raising Teacher cannot act on
  //    their own submission.
  const canActOnIssue = i => {
    if (r === 'vcrop_admin') return true;
    if (i.raisedByRole === 'head_teacher') return r === 'teacher';
    return r === 'org_admin' || r === 'cluster_coordinator' || r === 'head_teacher';
  };
  const allIssues = getMyIssues().slice().sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const filtered = allIssues.filter(i => {
    if (!q) return true;
    const t = APP.data.teachers.find(t => t.id === i.teacherId);
    const s = APP.data.schools.find(s => s.id === i.schoolId);
    return (t && t.name.toLowerCase().includes(q)) || (s && s.name.toLowerCase().includes(q)) ||
      (i.category || '').toLowerCase().includes(q) || (i.description || '').toLowerCase().includes(q) ||
      (i.status || '').toLowerCase().includes(q);
  });
  const sortedIssues = applySort(filtered, APP.sort.col, APP.sort.dir, (i, col) => {
    const t = APP.data.teachers.find(t => t.id === i.teacherId);
    const s = APP.data.schools.find(s => s.id === i.schoolId);
    if (col === 'teacher') return t ? t.name : '';
    if (col === 'school') return s ? s.name : '';
    if (col === 'category') return i.category || '';
    if (col === 'raisedBy') return i.raisedByName || '';
    if (col === 'date') return i.createdAt || '';
    if (col === 'status') return i.status || '';
    return '';
  });
  const pg = paginate(sortedIssues, 'issues', 50);
  const statusBadge = st => st === 'resolved' ? 'b-green' : st === 'in_progress' ? 'b-amber' : 'b-gray';
  const statusLbl = st => st === 'resolved' ? 'Resolved' : st === 'in_progress' ? 'In Progress' : 'Open';
  const roleTag = rr => rr === 'head_teacher' ? 'HT' : 'Teacher';
  // Whoever clicked In Progress / Resolve, named right under the status badge.
  const statusActorLine = i => {
    if (i.status === 'resolved' && i.resolvedByName) return `<div style="font-size:10px;color:#888;margin-top:2px">by ${i.resolvedByName}</div>`;
    if (i.status === 'in_progress' && i.inProgressByName) return `<div style="font-size:10px;color:#888;margin-top:2px">by ${i.inProgressByName}</div>`;
    return '';
  };
  return `${renderHelpLink('issues')}
  ${canRaise ? `<div style="margin-bottom:12px"><button class="btn btn-primary" onclick="openModal('new_issue')"><i class="ti ti-plus"></i> Raise an issue</button></div>` : ''}
  ${searchBox('issues', 'Search by teacher, school, category, description or status...')}
  <div class="card">
    <div class="card-header"><span class="card-title">Issues (${filtered.length}${q ? ' found' : ''})</span></div>
    ${filtered.length === 0 ? `<div class="empty-state"><i class="ti ti-circle-check"></i><p>${q ? 'No results found' : 'No issues raised'}</p></div>` : `
    <div class="desk-table table-wrap"><table class="table"><thead><tr><th onclick="setSort('teacher')" style="cursor:pointer;user-select:none;white-space:nowrap">Teacher ${sortIcon('teacher')}</th><th onclick="setSort('school')" style="cursor:pointer;user-select:none;white-space:nowrap">School ${sortIcon('school')}</th><th onclick="setSort('category')" style="cursor:pointer;user-select:none;white-space:nowrap">Category ${sortIcon('category')}</th><th onclick="setSort('raisedBy')" style="cursor:pointer;user-select:none;white-space:nowrap">Raised By ${sortIcon('raisedBy')}</th><th onclick="setSort('date')" style="cursor:pointer;user-select:none;white-space:nowrap">Date ${sortIcon('date')}</th><th onclick="setSort('status')" style="cursor:pointer;user-select:none;white-space:nowrap">Status ${sortIcon('status')}</th><th>Description</th><th>Actions</th></tr></thead>
    <tbody>${pg.pageItems.map(i => {
      const t = APP.data.teachers.find(t => t.id === i.teacherId);
      const s = APP.data.schools.find(s => s.id === i.schoolId);
      return `<tr>
        <td>${t ? highlight(t.name, q) : '—'}</td><td>${s ? highlight(s.name, q) : '—'}</td>
        <td>${highlight(i.category, q)}</td>
        <td>${i.raisedByName || '—'}<div style="font-size:10px;color:#888">${roleTag(i.raisedByRole)}</div></td>
        <td style="font-size:11px;color:#888;white-space:nowrap">${i.createdAt ? fmtDT(i.createdAt) : '—'}</td>
        <td><span class="badge ${statusBadge(i.status)}">${statusLbl(i.status)}</span>${statusActorLine(i)}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${highlight(i.description, q)}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">
          ${canActOnIssue(i) && i.status === 'open' ? `<button class="btn btn-sm" style="color:#1E40AF;border-color:#BFDBFE;background:#EFF6FF" onclick="markIssueInProgress('${i.id}')"><i class="ti ti-player-play"></i> In Progress</button>` : ''}
          ${canActOnIssue(i) && i.status !== 'resolved' ? `<button class="btn btn-sm" style="color:#166534;border-color:#BBF7D0;background:#F0FDF4" onclick="openModal('resolve_issue','${i.id}')"><i class="ti ti-check"></i> Resolve</button>` : ''}
          <button class="btn btn-sm btn-icon" onclick="openModal('view_issue','${i.id}')"><i class="ti ti-eye"></i></button>
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>${renderPaginationControls('issues', pg.currentPage, pg.totalPages, pg.totalCount, pg.pageSize)}</div>
    <div class="mob-list">${pg.pageItems.map(i => {
      const t = APP.data.teachers.find(t => t.id === i.teacherId);
      const s = APP.data.schools.find(s => s.id === i.schoolId);
      return `<div class="mob-item">
        <div class="mob-item-header"><div>
          <div class="mob-item-title">${i.category}</div>
          <div class="mob-item-sub">${t ? t.name : '—'} · ${s ? s.name : '—'}</div>
        </div><div style="text-align:right"><span class="badge ${statusBadge(i.status)}">${statusLbl(i.status)}</span>${statusActorLine(i)}</div></div>
        <div style="font-size:12px;color:var(--text2);margin-top:5px">${i.description}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">Raised by ${i.raisedByName || '—'} (${roleTag(i.raisedByRole)}) · ${i.createdAt ? fmtDT(i.createdAt) : '—'}</div>
        <div class="mob-item-actions" style="margin-top:6px">
          ${canActOnIssue(i) && i.status === 'open' ? `<button class="btn btn-sm" style="color:#1E40AF;border-color:#BFDBFE;background:#EFF6FF" onclick="markIssueInProgress('${i.id}')"><i class="ti ti-player-play"></i> In Progress</button>` : ''}
          ${canActOnIssue(i) && i.status !== 'resolved' ? `<button class="btn btn-sm" style="color:var(--green);border-color:#BBF7D0;background:#F0FDF4" onclick="openModal('resolve_issue','${i.id}')"><i class="ti ti-check"></i> Resolve</button>` : ''}
          <button class="btn btn-sm" onclick="openModal('view_issue','${i.id}')"><i class="ti ti-eye"></i> View</button>
        </div>
      </div>`;
    }).join('')}${renderPaginationControls('issues', pg.currentPage, pg.totalPages, pg.totalCount, pg.pageSize)}</div>`}
  </div>`;
}

function renderModalNewIssue() {
  const r = role();
  let optionsHtml = '';
  let noTargetsMsg = '';
  if (r === 'teacher') {
    const t = APP.data.teachers.find(t => t.userId === APP.user.id);
    const activeAllocs = t && t.allocations ? t.allocations.filter(isCurrentlyAllocated) : [];
    if (activeAllocs.length === 0) {
      noTargetsMsg = 'You have no active school allocation to raise an issue against.';
    } else {
      optionsHtml = activeAllocs.map(a => {
        const s = APP.data.schools.find(s => s.id === a.schoolId);
        return `<option value="${t.id}|${a.schoolId}">${s ? s.name : '—'}</option>`;
      }).join('');
    }
  } else if (r === 'head_teacher') {
    const mySchools = getMySchools();
    const rows = [];
    mySchools.forEach(s => {
      APP.data.teachers.filter(t => (t.allocations || []).some(a => a.schoolId === s.id && isCurrentlyAllocated(a)))
        .forEach(t => rows.push({ t, s }));
    });
    if (rows.length === 0) {
      noTargetsMsg = 'No currently-allocated teachers at your school(s) to raise an issue against.';
    } else {
      optionsHtml = rows.map(({ t, s }) => `<option value="${t.id}|${s.id}">${t.name} — ${s.name}</option>`).join('');
    }
  }
  if (noTargetsMsg) {
    return `<div class="modal">${mHead('Raise an issue')}<div class="empty-state"><i class="ti ti-alert-triangle"></i><p>${noTargetsMsg}</p></div>${mFoot('Close', 'closeModal')}</div>`;
  }
  return `<div class="modal">${mHead('Raise an issue')}
    <div class="alert alert-info" style="font-size:12px"><i class="ti ti-info-circle"></i> This will notify vCrop Admin, Org Admin and your Cluster Coordinator (if assigned) so they can step in.</div>
    <div class="form-group"><label class="form-label">${r === 'teacher' ? 'School *' : 'Teacher & School *'}</label>
      <select class="form-control" id="iss-target"><option value="">— Select —</option>${optionsHtml}</select></div>
    <div class="form-group"><label class="form-label">Category *</label>
      <select class="form-control" id="iss-category"><option value="">— Select category —</option>${ISSUE_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Description *</label>
      <textarea class="form-control" id="iss-desc" rows="4" placeholder="Describe the issue — what's happening and what needs to be resolved"></textarea></div>
    ${mFoot('<i class="ti ti-send"></i> Raise issue', 'submitIssue')}
  </div>`;
}

async function submitIssue() { return withBusyGuard(() => submitIssue_impl()); }
async function submitIssue_impl() {
  const target = document.getElementById('iss-target')?.value || '';
  const category = document.getElementById('iss-category')?.value || '';
  const description = document.getElementById('iss-desc')?.value.trim() || '';
  if (!target) { showToast('Please select ' + (role() === 'teacher' ? 'a school' : 'a teacher & school') + '.', 'danger'); return; }
  if (!category) { showToast('Please select a category.', 'danger'); return; }
  if (!description) { showToast('Please describe the issue.', 'danger'); return; }
  const [teacherId, schoolId] = target.split('|');
  const issue = {
    id: uid(), teacherId, schoolId, category, description,
    raisedBy: APP.user.id, raisedByName: APP.user.name, raisedByRole: role(),
    createdAt: new Date().toISOString(),
    status: 'open',
    inProgressBy: null, inProgressByName: null, inProgressAt: null,
    resolvedBy: null, resolvedByName: null, resolvedAt: null, resolutionNotes: null
  };
  await DB.set('issues', issue.id, issue);
  APP.data.issues.push(issue);
  const t = APP.data.teachers.find(t => t.id === teacherId);
  const s = APP.data.schools.find(s => s.id === schoolId);
  const msg = APP.user.name + ' (' + (role() === 'head_teacher' ? 'Head Teacher' : 'Teacher') + ') raised a ' + category + ' issue for ' + (t ? t.name : 'a teacher') + ' at ' + (s ? s.name : 'a school') + ': ' + description;
  await createNotificationDirect('issue', 'New issue raised — ' + category, msg, issue.id, APP.user.id, null, ['vcrop_admin', 'org_admin']);
  const cc = schoolId ? getCCForSchool(schoolId) : null;
  if (cc) {
    await DB.set('notifications', uid(), { type: 'issue', title: 'New issue raised — ' + category, message: msg, forUserId: cc.id, relatedId: issue.id, createdAt: new Date().toISOString(), read: false });
  }
  // The school's Head Teacher was never notified before — only vCrop Admin, Org Admin
  // and the Cluster Coordinator were. Since HT can also see this issue on their own
  // Issues screen (getMyIssues already scopes by schoolIds), they should hear about it
  // the same way everyone else does. Skip if the HT is the one who raised it themselves.
  const ht = schoolId ? getHTForSchool(schoolId) : null;
  if (ht && ht.id !== APP.user.id) {
    await DB.set('notifications', uid(), { type: 'issue', title: 'New issue raised — ' + category, message: msg, forUserId: ht.id, relatedId: issue.id, createdAt: new Date().toISOString(), read: false });
  }
  // When a Head Teacher raises an issue against a specific teacher, that teacher is the
  // subject of the issue and should be told about it — they were never notified before.
  // Not needed when a teacher raises their own issue (they already know, they wrote it).
  if (role() === 'head_teacher' && t && t.userId) {
    await DB.set('notifications', uid(), { type: 'issue', title: 'An issue was raised regarding you — ' + category, message: msg, forUserId: t.userId, relatedId: issue.id, createdAt: new Date().toISOString(), read: false });
  }
  closeModal(); showToast('Issue raised!', 'success'); syncData(true);
}

function renderModalViewIssue(id) {
  const i = (APP.data.issues || []).find(x => x.id === id);
  if (!i) return '';
  const t = APP.data.teachers.find(t => t.id === i.teacherId);

// Broadcasts an issue status-change notification to everyone who has a stake in it —
// the person who raised it, the subject teacher, the school's HT and CC, plus vCrop
// Admin and Org Admin for overall visibility — same set of parties that got notified
// when the issue was first raised. Whoever just performed the action (APP.user.id) is
// skipped so they don't get notified about their own click, and de-duped so a single
// physical user (e.g. the raiser and the HT being the same person) doesn't get two
// separate notification documents for the same event.
async function notifyIssueUpdate(i, title, msg) {
  const excludeId = APP.user.id;
  const notified = new Set([excludeId]);
  const directTargets = [];
  if (i.raisedBy) directTargets.push(i.raisedBy);
  const t = APP.data.teachers.find(t => t.id === i.teacherId);
  if (t && t.userId) directTargets.push(t.userId);
  const ht = i.schoolId ? getHTForSchool(i.schoolId) : null;
  if (ht) directTargets.push(ht.id);
  const cc = i.schoolId ? getCCForSchool(i.schoolId) : null;
  if (cc) directTargets.push(cc.id);
  for (const targetId of directTargets) {
    if (notified.has(targetId)) continue;
    notified.add(targetId);
    await DB.set('notifications', uid(), { type: 'issue', title, message: msg, forUserId: targetId, relatedId: i.id, createdAt: new Date().toISOString(), read: false });
  }
  // vCrop Admin + Org Admin — same broadcast used when the issue was first raised.
  await createNotificationDirect('issue', title, msg, i.id, excludeId, null, ['vcrop_admin', 'org_admin']);
}

// `targetDate` (optional, 'YYYY-MM-DD'): for a multi-day Date-Range cancellation, advance
// notice is recalculated per day — anchored to that day's own start (using the same
// school start time entered once for the whole range) rather than always the range's
// first day. Defaults to c.scheduledDate (fromDate for range type) when not provided,
// e.g. when just listing the cancellation record itself rather than a specific day.
function calcAdvanceNoticeText(c, targetDate) {
  const effectiveDate = targetDate || c.scheduledDate;
  if (!(effectiveDate && c.scheduledTime && c.notifiedAt)) return { text: '—', color: '#888' };
  const schedDT = new Date(effectiveDate + 'T' + c.scheduledTime);
  const notifDT = new Date(c.notifiedAt);
  const diffMs = schedDT - notifDT;
  const diffHrs = diffMs / (1000 * 60 * 60);
  const hh = Math.floor(Math.abs(diffHrs));
  const mm = Math.round((Math.abs(diffHrs) - hh) * 60);
  const label = hh > 0 ? hh + 'h ' + mm + 'min' : mm + 'min';
  if (diffMs < 0) return { text: `Late (${label} after)`, color: '#DC2626' };
  if (diffHrs < 1) return { text: `${label} (Very short)`, color: '#DC2626' };
  if (diffHrs < 24) return { text: `${label} before`, color: '#D97706' };
  return { text: `${label} before`, color: '#16A34A' };
}

// Billing rule: a class cancelled with less than 24 hours' notice is still billable to
// the Organization (the teacher had insufficient time to be reassigned). Used to flag
// the Advance Notice cell red in the Attendance Excel export. Includes "late" notices
// (negative advance notice) since those are an even shorter-notice case than <24h.
// `targetDate` — same day-specific override as calcAdvanceNoticeText above.
function isShortNoticeCancellation(c, targetDate) {
  const effectiveDate = targetDate || (c && c.scheduledDate);
  if (!(c && effectiveDate && c.scheduledTime && c.notifiedAt)) return false;
  const schedDT = new Date(effectiveDate + 'T' + c.scheduledTime);
  const notifDT = new Date(c.notifiedAt);
  const diffHrs = (schedDT - notifDT) / (1000 * 60 * 60);
  return diffHrs < 24;
}

// Finds the cancellation (if any) that actually applies to a given attendance row.
// Matches on teacher + school always; for "specific" cancellations also requires an
// exact class/section match on the same date; for "range" cancellations, checks the
// attendance date falls within [fromDate, toDate] rather than exact date equality.
function findAttendanceCancellation(a) {
  return APP.data.cancellations.find(c => {
    if (c.teacherId !== a.teacherId) return false;
    if (c.schoolId !== a.schoolId) return false;
    if (c.type === 'range') {
      return c.fromDate <= a.date && a.date <= c.toDate;
    }
    return c.scheduledDate === a.date && String(c.cls) === String(a.cls) && c.section === a.section;
  });
}

// ─── Billing classification for a single attendance row ────────────────────
// Implements the full confirmed billing rule set (see VTMS_Billing_Logic_Scenarios):
//  - Conducted: normal Approved / Un-Approved split on the row's own Duration (no more
//    "× Classes Conducted" multiplier — each row already represents one class).
//  - Cancelled / Not Conducted / All Classes Cancelled (day-level), WITH a formal
//    cancellation record: billable only if that record's advance notice was <24h,
//    re-checked per day for multi-day range cancellations (same school start time
//    applied to every day in the range). ≥24h notice = correctly not billed.
//  - Cancelled / All Classes Cancelled, NO formal record at all: still billable
//    regardless of approval status ("Unrecorded Cancellation").
//  - Not Conducted, NO formal record: never billable — this is the teacher's own
//    reason (e.g. missed one of several assigned classes), not a school-side cancellation.
//  - School Holiday / On Leave: never billable.
// Minutes for any billable exception use 40 (the standard class length), multiplied by
// Classes Assigned for day-level cancelled days (a cancelled day can represent several
// classes' worth of disruption), since Duration is forced to 0 for these rows on the form.
function getRowBillability(a) {
  const isDayLevelCancelled = a.classStatus === 'All Classes Cancelled';
  const isCancelledOrNotConducted = a.classStatus === 'Cancelled' || a.classStatus === 'Not Conducted' || isDayLevelCancelled;
  const dayMultiplier = isDayLevelCancelled ? (a.totalAssigned || 0) : 1;
  // Duration is auto-forced to 0 on the live Mark Attendance form for these statuses,
  // but admins can still manually set a real duration when correcting a record via the
  // Edit Attendance modal — if they did, that real value should be billed, not the 40min
  // default (which only exists to stand in for the normal "nothing was taught" case).
  const exceptionMinutes = (a.duration > 0 ? a.duration : 40) * dayMultiplier;

  if (a.classStatus === 'Conducted') {
    // Org Admin approval is no longer part of the workflow — Head Teacher approval is
    // now final. Old records that genuinely went through the two-stage process keep
    // their real orgApproval history in the database, but billing no longer requires
    // or checks it; headApproval alone determines billable status for every record,
    // old and new.
    const fullyApproved = a.headApproval === 'approved';
    return { bucket: fullyApproved ? 'approved' : 'unapproved', minutes: a.duration || 0 };
  }
  // Not Conducted from Teacher End: this is always the teacher's own reason (e.g. missed
  // one of several assigned classes) — never billable, full stop. Checked before the
  // cancellation-record lookup below so that a formal Class Cancellation record that
  // happens to coincidentally exist for the same teacher/school/date (e.g. a range
  // cancellation covering that day for a different class) can never turn a "Not Conducted"
  // row billable — that record has nothing to do with why this particular row wasn't taught.
  if (a.classStatus === 'Not Conducted') return { bucket: 'none', minutes: 0 };
  if (isCancelledOrNotConducted) {
    const canc = findAttendanceCancellation(a);
    if (canc) {
      const short = isShortNoticeCancellation(canc, a.date); // day-specific notice check
      if (short) return { bucket: 'shortNotice', minutes: exceptionMinutes };
      return { bucket: 'none', minutes: 0 }; // ≥24h notice — fair warning was given
    }
    return { bucket: 'unrecorded', minutes: exceptionMinutes }; // Cancelled / All Classes Cancelled, no formal record
  }
  return { bucket: 'none', minutes: 0 }; // School Holiday / On Leave / anything else
}

// Distinguishes a genuine Head Teacher approval from the system's auto-approval (which
// stamps headApprovedByName with 'Auto (non-working day)' or 'Auto (class cancelled/not
// conducted)' — see submitAttendance_impl) so reports don't misrepresent an auto-approved
// row as if a Head Teacher had actually reviewed and approved it.
function htApprovalStatusLabel(a) {
  if (a.headApproval === 'approved') {
    return (a.headApprovedByName || '').indexOf('Auto') === 0 ? 'Auto-Approved' : 'Approved';
  }
  if (a.headApproval === 'rejected') return 'Rejected';
  return 'Pending';
}

function downloadConsolidatedExcel() {
  const f = APP.reportFilters;
  const useCustomRange = !!(f.dateFrom && f.dateTo);
  if (!useCustomRange && !f.billingMonth) { showToast('Please select a billing month, or a From/To date range, above before downloading.', 'danger'); return; }
  if ((f.dateFrom && !f.dateTo) || (!f.dateFrom && f.dateTo)) { showToast('Please set both a From date and a To date, or clear both and use the billing month instead.', 'danger'); return; }
  if (useCustomRange) {
    const check = validateReportDownloadRange(); // same server-load cap as other reports: 31 days / 92 days for org-level roles
    if (!check.valid) { showToast(check.message, 'danger'); return; }
  }
  const data = getConsolidatedReportDisplayData();
  const { session, monthLabel } = getConsolidatedPeriod();
  // The top-of-sheet "Period" line always shows the literal filter that was actually
  // applied (exact date range, or the picked billing month) — for full transparency/
  // audit-ability. This is intentionally separate from the per-row "Month/Year" column
  // and Session, which still show the friendlier collapsed label (e.g. "June 2026") when
  // the range matches the standard 16th–15th cycle.
  const periodMetaLine = useCustomRange
    ? (f.dateFrom === f.dateTo ? `Period: ${fmtDate(f.dateFrom)}` : `Period: ${fmtDate(f.dateFrom)} to ${fmtDate(f.dateTo)}`)
    : `Period: ${monthLabel}`;
  const headers = ['S.No','Session','Month/Year','Teacher Name','Class','School Location/District','State','Subject','Teacher Allocation Date','Teacher De-allocation Date','Approved Min.','Short-Notice Cancelled Min. (Billable)','Unrecorded Cancellation Min. (Billable)','Total Billable Min.','Un-Approved Min.','Teacher Mobile','Teacher Email ID'];
  const shortNoticeFlags = data.map(d => d.shortNoticeMin > 0);
  const unrecordedFlags = data.map(d => d.unrecordedMin > 0);
  const rows = data.map((d, i) => [i+1, d.session, d.monthLabel, d.teacherName, d.cls, d.location, d.state, d.subject, d.allocatedAt, d.deallocatedAt, d.approvedMin, formatExceptionCell(d.shortNoticeMin, d.shortNoticeDates, true).text, formatExceptionCell(d.unrecordedMin, d.unrecordedDates, true).text, d.totalBillableMin, d.unapprovedMin, d.mobile, d.email]);
  downloadExcelGeneric(`VTMS_Consolidated_Billing_Report_${getExcelFilenameTimestamp()}.xlsx`, headers, rows, ['Consolidated Report (Billing)', `Session: ${session}`, periodMetaLine, getFilterSummaryLine(), `Generated on: ${fmtDT(new Date().toISOString())}`, 'Total Billable Min. = Approved + Short-Notice Cancelled + Unrecorded Cancellation. Red "Short-Notice Cancelled Min." = formal cancellation record with <24h notice. Amber "Unrecorded Cancellation Min." = Cancelled/All Classes Cancelled with NO formal record at all — still billable regardless of approval status.'],
    [
      { colIndex: headers.indexOf('Short-Notice Cancelled Min. (Billable)'), rowFlags: shortNoticeFlags, fillColor: 'FFFEE2E2', fontColor: 'FF991B1B' },
      { colIndex: headers.indexOf('Unrecorded Cancellation Min. (Billable)'), rowFlags: unrecordedFlags, fillColor: 'FFFEF3C7', fontColor: 'FF92400E' },
    ]);
}

// A school day has 6 class periods, so this is the most a single teacher can be
// committed to across ALL their active schools combined — not a per-school cap.
const MAX_DAILY_CLASSES_PER_TEACHER = 6;

// classesPerDay (a plain number picked from a dropdown) and assignedClasses (the actual
// list of specific class+section rows) are edited independently — classesPerDay at
// allocation time, assignedClasses either then or later via "Edit classes" — so they can
// drift apart. E.g. an admin allocates with classesPerDay=3, then later adds 6 specific
// class rows via "Edit classes" without ever revisiting the classesPerDay number, leaving
// it understating reality. Taking the max is always safe: it never invents capacity that
// wasn't declared (classesPerDay can still exceed the list when not all specific classes
// have been itemized yet), but it can never let a concretely-listed class go uncounted.
function effectiveCpd(a) {
  return Math.max(a.classesPerDay || 0, (a.assignedClasses || []).length);
}

function renderTeachers() {
  const r = role();
  const mySchools = getMySchools();
  const allTeachers = r === 'vcrop_admin' ? APP.data.teachers : APP.data.teachers.filter(t => t.allocations && t.allocations.some(a => mySchools.some(s => s.id === a.schoolId) && a.active));
  const q = getSearch('teachers');
  const teachers = allTeachers.filter(t => {
    const activeAllocs = (t.allocations||[]).filter(a=>a.active);
    const schoolNames = activeAllocs.map(a=>{const s=APP.data.schools.find(s=>s.id===a.schoolId);return s?s.name:'';}).join(' ');
    const isNotAllocated = activeAllocs.length === 0;
    // "Available" is about remaining daily class capacity, not school count — a teacher
    // already committed to 6/6 classes at a single school has zero room left and should
    // NOT show as available, while a teacher spread across 2 schools with spare capacity
    // (e.g. 3+2=5 of 6) still can. Replaces the old "0 or 1 schools" approximation, which
    // incorrectly called a maxed-out single-school teacher available and incorrectly
    // excluded a lightly-loaded two-school teacher.
    const totalActiveCpd = activeAllocs.reduce((sum, a) => sum + effectiveCpd(a), 0);
    const isAvailable = totalActiveCpd < MAX_DAILY_CLASSES_PER_TEACHER;
    const matchesNotAllocated = (q.includes('not allocated') || q.includes('unallocated') || q === 'no school') && isNotAllocated;
    const matchesAvailable = q === 'available' && isAvailable;
    return !q || matchesNotAllocated || matchesAvailable || t.name.toLowerCase().includes(q) || t.subjects.join(' ').toLowerCase().includes(q) || t.grades.join(' ').toLowerCase().includes(q) || (t.phone||'').includes(q) || schoolNames.toLowerCase().includes(q);
  });
  return `${renderHelpLink('teachers')}
  ${r === 'vcrop_admin' ? `<div style="margin-bottom:12px;display:flex;gap:8px">
    <button class="btn btn-primary" onclick="openModal('new_teacher')"><i class="ti ti-plus"></i> Add teacher</button>
    <button class="btn" onclick="openModal('allocate_teacher')"><i class="ti ti-link"></i> Allocate to school</button>
  </div>` : ''}

async function deAllocate(tid) { /* replaced by confirmDeAllocate */ }

async function confirmDeAllocate(tid) { return withBusyGuard(() => confirmDeAllocate_impl(tid)); }
async function confirmDeAllocate_impl(tid) {
  const schoolId = document.getElementById('dealloc-school').value;
  const lastDate = document.getElementById('dealloc-date').value;
  if (!schoolId) { showToast('Please select a school.', 'danger'); return; }
  if (!lastDate) { showToast('Please enter the last working date.', 'danger'); return; }
  const t = APP.data.teachers.find(t => t.id === tid);
  if (!t) return;
  t.allocations = t.allocations.map(a =>
    a.schoolId === schoolId ? { ...a, active: false, lastDate } : a
  );
  await DB.update('teachers', tid, { allocations: t.allocations });
  // Notify everyone with a stake in this school — previously only the teacher was
  // notified, so an Org Admin/Head Teacher/CC had no way to know a de-allocation had
  // even happened unless the teacher happened to mention it. Mirrors the same
  // recipient pattern used for allocation. Every message includes the actual last
  // working date, not just "de-allocated", since that date is what everyone actually
  // needs to plan around (the teacher is still there until then).
  const deallocSchool = APP.data.schools.find(s => s.id === schoolId);
  const deallocNotifMsg = APP.user.name + ' de-allocated ' + t.name + ' from ' + (deallocSchool ? deallocSchool.name : 'a school') + '. Last working date: ' + fmtDate(lastDate) + '.';
  const deallocCC = deallocSchool ? getCCForSchool(deallocSchool.id) : null;
  await createNotificationDirect('deallocation', 'Teacher de-allocated from school', deallocNotifMsg, tid, APP.user.id, null, ['org_admin']);
  if (deallocCC) {
    await DB.set('notifications', uid(), { type:'deallocation', title:'Teacher de-allocated from school', message: deallocNotifMsg, forUserId: deallocCC.id, relatedId: tid, createdAt: new Date().toISOString(), read: false });
  }
  const deallocHT = deallocSchool ? getHTForSchool(deallocSchool.id) : null;
  if (deallocHT) {
    await DB.set('notifications', uid(), { type:'deallocation', title:'Teacher de-allocated from your school', message: deallocNotifMsg, forUserId: deallocHT.id, relatedId: tid, createdAt: new Date().toISOString(), read: false });
  }
  // Notify the teacher about de-allocation
  if (t.userId) {
    const deallocMsg = 'You have been de-allocated from ' + (deallocSchool ? deallocSchool.name : 'a school') + ' by ' + APP.user.name + '. Last working date: ' + fmtDate(lastDate) + '.';
    await DB.set('notifications', uid(), { type:'deallocation', title:'You have been de-allocated from a school', message: deallocMsg, forUserId: t.userId, relatedId: tid, createdAt: new Date().toISOString(), read: false });
  }
  closeModal();
  showToast('Teacher de-allocated from selected school.', 'success');
  render();
}

}
function mFoot(label, fn) {

}

// Prevents double-submission: if a write is already in flight, ignore the click.
// Disables the clicked button (if event is available) and restores it when done.
async function withBusyGuard(fn) {
  if (APP.busy) return;
  APP.busy = true;
  let btn = null;
  let originalHTML = null;
  try {
    if (typeof event !== 'undefined' && event && event.target) {
      btn = event.target.closest('button');
      if (btn) {
        originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.style.cursor = 'not-allowed';
        // Swap in a spinner + "Processing..." instead of just dimming the
        // button — some actions (signing in, resetting a password) now do a
        // real secure verification step behind the scenes and can take a
        // moment longer than before, and a dimmed button alone made it easy
        // to think a click hadn't registered at all.
        btn.innerHTML = '<span class="btn-spinner"></span>Processing…';
      }
    }
    await fn();
  } finally {
    APP.busy = false;
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = '';
      btn.style.cursor = '';
      if (originalHTML !== null) btn.innerHTML = originalHTML;
    }
  }
}

async function submitReq() { return withBusyGuard(() => submitReq_impl()); }
async function submitReq_impl() {
  const grade = document.getElementById('req-grade').value.trim();
  const subject = document.getElementById('req-subject').value.trim();
  const count = parseInt(document.getElementById('req-count').value) || 1;
  const classesPerDay = parseInt(document.getElementById('req-classes')?.value) || 0;
  const syllabus = document.getElementById('req-syllabus').value.trim();
  const notes = document.getElementById('req-notes').value.trim();
  if (!grade || !subject || !syllabus) { showToast('Fill all required fields.', 'danger'); return; }
  if (!classesPerDay) { showToast('Please select classes per day.', 'danger'); return; }
  const r = role();
  // Always read the school directly from the selector now — see renderModalNewReq for
  // why this can no longer default to a possibly-wrong/stale school behind the user's
  // back for Head Teacher or any other multi-school role.
  const schoolId = document.getElementById('req-school')?.value || '';
  if (!schoolId) { showToast('Please select a school.', 'danger'); return; }
  // CC bypass check: if HT raises req and CC is assigned → cc_pending
  const cc = getCCForSchool(schoolId);
  const raisedByCC = r === 'cluster_coordinator';
  const initialStatus = (!raisedByCC && cc) ? 'cc_pending' : 'pending';
  const req = {
    id: uid(), schoolId, grade, subject, count, classesPerDay,
    syllabusStatus: syllabus, notes, status: initialStatus,
    raisedByRole: r, raisedByName: APP.user.name,
    createdBy: APP.user.id, createdAt: new Date().toISOString(),
    ccBypassed: !raisedByCC && !cc,
    ccApproval: null, ccApprovedAt: null, ccApprovedByName: null,
    orgApproval: null, approvedByName: null, approvedAt: null, selectedTeacher: null
  };
  await DB.set('requirements', req.id, req);
  APP.data.requirements.push(req);
  const sch = APP.data.schools.find(s => s.id === schoolId);
  const schName = sch ? sch.name : 'school';
  const msg = APP.user.name + ' posted a requirement for ' + subject + ' (' + gradeLabel(grade) + ') from ' + schName;
  if (initialStatus === 'cc_pending' && cc) {
    // Notify vCrop Admin + Org Admin that requirement was raised (pending CC)
    await createNotification('requirement', 'Requirement needs CC approval', msg, ['vcrop_admin', 'org_admin'], req.id, APP.user.id);
    // Notify CC directly for action
    await DB.set('notifications', uid(), { type:'requirement', title:'New requirement to approve', message: msg, forUserId: cc.id, relatedId: req.id, createdAt: new Date().toISOString(), read: false });
  } else {
    await createNotification('requirement', 'Requirement needs Org Admin approval', msg, ['vcrop_admin'], req.id, APP.user.id);
    await createNotification('requirement', 'New requirement to approve', msg, ['org_admin'], req.id, APP.user.id);
  }
  // If a CC raised this requirement, notify the school's Head Teacher(s) too
  if (raisedByCC) {
    const htMsg = 'CC (' + APP.user.name + ') has raised new requirement for your school.';
    const hts = APP.data.users.filter(u => u.role === 'head_teacher' && !u.disabled &&
      ((u.schoolIds && u.schoolIds.includes(schoolId)) || u.schoolId === schoolId));
    for (const ht of hts) {
      await DB.set('notifications', uid(), { type:'requirement', title:'New requirement raised for your school', message: htMsg, forUserId: ht.id, relatedId: req.id, createdAt: new Date().toISOString(), read: false });
    }
  }
  closeModal(); showToast('Requirement submitted!', 'success'); syncData(true);
}

function updateCancTeachers(mode) {
  const schoolId = document.getElementById('canc-school-' + mode)?.value;
  // Range cancellations can go to several teachers at once (e.g. a school holiday
  // affects everyone there), so this mode gets a checkbox list + "All teachers"
  // toggle instead of a single-select — see toggleAllCancTeachers/
  // onCancTeacherRangeCbChange below. A specific-class cancellation is inherently
  // about one class/section/subject taught by one teacher, so that mode keeps the
  // original single-select.
  if (mode === 'range') {
    const listEl = document.getElementById('canc-teachers-range-list');
    if (!listEl) return;
    if (!schoolId) { listEl.innerHTML = '<div style="color:#94A3B8;font-size:13px">— Select school first —</div>'; return; }
    const schoolTeachers = APP.data.teachers.filter(t =>
      t.allocations && t.allocations.some(a => a.schoolId === schoolId && a.active)
    );
    if (schoolTeachers.length === 0) {
      listEl.innerHTML = '<div style="color:#94A3B8;font-size:13px">No teachers allocated to this school</div>';
      return;
    }
    listEl.innerHTML = `
      <label style="display:flex;align-items:center;gap:8px;padding:5px 0 8px;font-weight:600;border-bottom:1px solid var(--border);margin-bottom:6px;cursor:pointer">
        <input type="checkbox" id="canc-teacher-range-all" onchange="toggleAllCancTeachers(this.checked)"> All teachers
      </label>
      ${schoolTeachers.map(t => `
      <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer">
        <input type="checkbox" class="canc-teacher-range-cb" value="${t.id}" onchange="onCancTeacherRangeCbChange()"> ${t.name}
      </label>`).join('')}`;
    return;
  }
  const teacherSel = document.getElementById('canc-teacher-' + mode);
  if (!teacherSel) return;
  if (!schoolId) {
    teacherSel.innerHTML = '<option value="">— Select school first —</option>';
    return;
  }
  // Filter teachers allocated to this school
  const schoolTeachers = APP.data.teachers.filter(t =>

// Returns every ISO date string ('YYYY-MM-DD') from `from` to `to` inclusive. Used to
// work out exactly which days within a requested cancellation range are NOT already
// covered by an existing overlapping cancellation, so only the genuinely-new portion
// gets sent rather than skipping the whole range.
function dateRangeArray(from, to) {
  const dates = [];
  let d = new Date(from + 'T00:00:00Z');
  const end = new Date(to + 'T00:00:00Z');
  while (d <= end) {
    dates.push(d.toISOString().slice(0, 10));
    d = new Date(d.getTime() + 86400000);
  }
  return dates;
}
// Collapses a sorted array of ISO date strings into contiguous [from, to] pairs, e.g.
// ['2026-08-01','2026-08-02','2026-08-05'] -> [['2026-08-01','2026-08-02'],['2026-08-05','2026-08-05']].
// Needed because an existing cancellation can sit in the MIDDLE of a newly requested
// range, leaving two separate uncovered chunks that each need their own record.
function groupConsecutiveDateRanges(dates) {
  if (!dates.length) return [];
  const ranges = [];
  let start = dates[0], prev = dates[0];
  for (let i = 1; i < dates.length; i++) {
    const d = dates[i];
    const expectedNext = new Date(new Date(prev + 'T00:00:00Z').getTime() + 86400000).toISOString().slice(0, 10);
    if (d === expectedNext) {
      prev = d;
    } else {
      ranges.push([start, prev]);
      start = d; prev = d;
    }
  }
  ranges.push([start, prev]);
  return ranges;
}

async function submitCancel() { return withBusyGuard(() => submitCancel_impl()); }
async function submitCancel_impl() {
  const type = document.getElementById('canc-type').value;
  if (!type) { showToast('Please select cancellation type.', 'danger'); return; }

  if (type === 'range') {
    const school = document.getElementById('canc-school-range').value;
    const teacherIds = Array.from(document.querySelectorAll('.canc-teacher-range-cb:checked')).map(cb => cb.value);
    const fromDate = document.getElementById('canc-from').value;
    const toDate = document.getElementById('canc-to').value;
    if (!school) { showToast('Please select a school.', 'danger'); return; }
    if (!teacherIds.length) { showToast('Please select at least one teacher to notify.', 'danger'); return; }
    if (!fromDate) { showToast('Please select from date.', 'danger'); return; }
    if (!toDate) { showToast('Please select to date.', 'danger'); return; }
    if (toDate < fromDate) { showToast('To date cannot be before from date.', 'danger'); return; }

    const cancelSchool = APP.data.schools.find(s => s.id === school);
    const startTime = document.getElementById('canc-start-time')?.value || '08:00';

    const sentSummaries = [];
    const skippedNames = [];
    for (const teacher of teacherIds) {
      const cancelTeacher = APP.data.teachers.find(t => t.id === teacher);
      // Scoped to THIS teacher, not just the school — a different teacher at the same
      // school with an overlapping range must still be allowed; they'd otherwise never
      // get notified at all just because someone else at their school already was.
      const teacherOverlaps = (APP.data.cancellations || []).filter(c =>
        c.type === 'range' && c.schoolId === school && c.teacherId === teacher &&
        c.fromDate <= toDate && c.toDate >= fromDate
      );
      // Don't skip the WHOLE requested range just because SOME of it overlaps an
      // existing cancellation — e.g. existing 29-31 Jul + new 31 Jul-1 Aug should still
      // send 1 Aug, which was never actually covered before. Walk every date in the
      // requested range and keep only the ones not already covered by any existing
      // overlapping cancellation for this teacher, then group the leftover dates back
      // into contiguous sub-ranges (there can be more than one, if an existing
      // cancellation sits in the middle of the new range) and send one record per
      // sub-range — each with its own accurate date label in the notification.
      const subRanges = teacherOverlaps.length
        ? groupConsecutiveDateRanges(dateRangeArray(fromDate, toDate).filter(d => !teacherOverlaps.some(c => c.fromDate <= d && c.toDate >= d)))
        : [[fromDate, toDate]];
      if (!subRanges.length) {
        skippedNames.push(cancelTeacher ? cancelTeacher.name : 'Unknown');
        continue;
      }
      const sentLabels = [];
      for (const [subFrom, subTo] of subRanges) {
        const subDateLabel = subFrom === subTo ? fmtDate(subFrom) : fmtDate(subFrom) + ' to ' + fmtDate(subTo);
        const rangeMsg = APP.user.name + ' cancelled all classes at ' + (cancelSchool ? cancelSchool.name : 'school') + ' for ' + subDateLabel;
        const rec = { id: uid(), type: 'range', schoolId: school, teacherId: teacher, fromDate: subFrom, toDate: subTo, scheduledDate: subFrom, scheduledTime: startTime, notifiedAt: new Date().toISOString(), notifiedBy: APP.user.id };
        await DB.set('cancellations', rec.id, rec);
        APP.data.cancellations.push(rec);
        // Notify teacher directly
        if (cancelTeacher && cancelTeacher.userId) {
          await DB.set('notifications', uid(), { type:'cancellation', title:'All classes cancelled', message: rangeMsg, forUserId: cancelTeacher.userId, relatedId: rec.id, createdAt: new Date().toISOString(), read: false });
        }
        // Notify CC assigned to the school
        const cancCC = getCCForSchool(school);
        if (cancCC) {
          await DB.set('notifications', uid(), { type:'cancellation', title:'All classes cancelled', message: rangeMsg, forUserId: cancCC.id, relatedId: rec.id, createdAt: new Date().toISOString(), read: false });
        }
        // Notify Org Admin and vCrop Admin
        await createNotification('cancellation', 'All classes cancelled', rangeMsg, ['org_admin', 'vcrop_admin'], rec.id, APP.user.id);
        sentLabels.push(subDateLabel);
      }
      const fullLabel = fromDate === toDate ? fmtDate(fromDate) : fmtDate(fromDate) + ' to ' + fmtDate(toDate);
      const isPartial = subRanges.length > 1 || sentLabels[0] !== fullLabel;
      sentSummaries.push((cancelTeacher ? cancelTeacher.name : 'Unknown') + (isPartial ? ` (${sentLabels.join(', ')} only — rest already covered)` : ''));
    }

    if (!sentSummaries.length) {
      // Every selected teacher already had the entire requested range covered —
      // nothing was actually sent, so don't close the modal or claim success.
      const fullLabel = fromDate === toDate ? fmtDate(fromDate) : fmtDate(fromDate) + ' to ' + fmtDate(toDate);
      showToast(`All selected teachers already have this fully covered — ${fullLabel} at ${cancelSchool ? cancelSchool.name : 'this school'}: ${skippedNames.join(', ')}.`, 'danger');
      return;
    }
    closeModal();
    showToast(skippedNames.length
      ? `Sent to: ${sentSummaries.join('; ')}. Fully already covered (skipped): ${skippedNames.join(', ')}.`
      : `Sent to: ${sentSummaries.join('; ')}.`, 'success');
    syncData(true);
    return;

  } else {
    const school = document.getElementById('canc-school-specific').value;
    const subject = document.getElementById('canc-subject').value;
    const cls = document.getElementById('canc-cls').value;
    const sec = document.getElementById('canc-sec').value;
    const teacher = document.getElementById('canc-teacher-specific').value;
    const date = document.getElementById('canc-date').value;
    const time = document.getElementById('canc-time').value;
    if (!school) { showToast('Please select a school.', 'danger'); return; }
    if (!subject || !cls || !sec) { showToast('Please select subject, class and section.', 'danger'); return; }
    if (!teacher) { showToast('Please select a teacher to notify.', 'danger'); return; }
    if (!date || !time) { showToast('Please enter scheduled date and time.', 'danger'); return; }

    const cancelSchoolSpec = APP.data.schools.find(s => s.id === school);
    // Check 1: Range cancellation already covers this date for THIS teacher at this
    // school (scoped by teacher, same fix as the range-type check above — a range
    // cancellation sent to a different teacher must not block this one).
    const coveringRange = (APP.data.cancellations || []).find(c =>
      c.type === 'range' && c.schoolId === school && c.teacherId === teacher &&
      c.fromDate <= date && c.toDate >= date
    );
    if (coveringRange) {
      showToast(`All classes are already cancelled for ${fmtDate(date)} at ${cancelSchoolSpec ? cancelSchoolSpec.name : 'this school'} for this teacher.`, 'danger');
      return;
    }
    // Check 2: Same specific class cancellation already exists
    const existingSpecific = (APP.data.cancellations || []).find(c =>
      c.type === 'specific' && c.schoolId === school &&
      c.scheduledDate === date && String(c.cls) === String(cls) && c.section === sec
    );
    if (existingSpecific) {
      showToast(`Class ${cls}-${sec} is already cancelled on ${fmtDate(date)} at ${cancelSchoolSpec ? cancelSchoolSpec.name : 'this school'}.`, 'danger');
      return;
    }
    const rec = { id: uid(), type: 'specific', schoolId: school, subject, cls, section: sec, teacherId: teacher, scheduledDate: date, scheduledTime: time, notifiedAt: new Date().toISOString(), notifiedBy: APP.user.id };
    await DB.set('cancellations', rec.id, rec);
    APP.data.cancellations.push(rec);
    const cancelTeacher = APP.data.teachers.find(t => t.id === teacher);
    const specMsg = APP.user.name + ' cancelled ' + subject + ' class (Class ' + cls + '-' + sec + ') at ' + (cancelSchoolSpec ? cancelSchoolSpec.name : 'school') + ' scheduled on ' + fmtDate(date) + ' at ' + time;
    // Notify teacher directly
    if (cancelTeacher && cancelTeacher.userId) {
      await DB.set('notifications', uid(), { type:'cancellation', title:'Class cancelled', message: specMsg, forUserId: cancelTeacher.userId, relatedId: rec.id, createdAt: new Date().toISOString(), read: false });
    }
    // Notify CC assigned to the school
    const specCC = getCCForSchool(school);
    if (specCC) {
      await DB.set('notifications', uid(), { type:'cancellation', title:'Class cancelled', message: specMsg, forUserId: specCC.id, relatedId: rec.id, createdAt: new Date().toISOString(), read: false });
    }
    // Notify Org Admin and vCrop Admin
    await createNotification('cancellation', 'Class cancelled', specMsg, ['org_admin', 'vcrop_admin'], rec.id, APP.user.id);
  }

  closeModal(); showToast('Cancellation notification sent!', 'success'); syncData(true);
}
